name: Apply v0.14.2 Project View fixes

permissions:
  contents: write

on:
  push:
    paths:
      - .github/workflows/apply-v0142-project-view-fixes.yml
  workflow_dispatch:

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply source migration
        run: python scripts/apply_v0142_project_view_fixes.py
      - name: Format
        run: cargo fmt --all
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path Cargo.toml -Pattern 'version = "0.14.2"' | Out-Null
          Select-String -Path src/app_main.rs -Pattern 'project-view-preview-scroll' | Out-Null
          Select-String -Path src/app_main.rs -Pattern 'project-view-snapshots-grid' | Out-Null
          Select-String -Path src/previous_shades.rs -Pattern 'recent_snapshots' | Out-Null
          Select-String -Path src/workflow_v0103.rs -Pattern 'curve_graph_focused' | Out-Null
      - name: Check locked Windows build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README.md RELEASE_NOTES.md src/app_main.rs src/previous_shades.rs src/workflow_v0103.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Improve Project View layout and Curve shortcuts"
          git push origin HEAD:main
