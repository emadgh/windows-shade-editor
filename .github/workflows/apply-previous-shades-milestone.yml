                  } else if save && self.save_project(false) {
                      self.show_snapshot_save_reminder = false;
                  } else if save_as && self.save_project(true) {
                      self.show_snapshot_save_reminder = false;
                  } else if later {
                      self.show_snapshot_save_reminder = false;
                  }
              }

