                  self.add_faces_paths(paths);
              }

              fn handle_dropped_files(&mut self, ctx: &egui::Context) {
                  if self.job.is_some() {
                      return;
                  }
                  let paths = ctx.input(|input| {
                      input
                          .raw
                          .dropped_files
                          .iter()
