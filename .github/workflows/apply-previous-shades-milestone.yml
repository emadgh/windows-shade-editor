          helpers = r'''fn unique_shade_path(directory: &Path, stem: &str) -> PathBuf {
              let candidate = directory.join(format!("{stem}.shade"));
              if !candidate.exists() {
                  return candidate;
              }
              for number in 2u32.. {
                  let candidate = directory.join(format!("{stem}-{number}.shade"));
                  if !candidate.exists() {
                      return candidate;
                  }
              }
              unreachable!()
          }

          fn format_previous_shade_time(unix_ms: i64) -> String {
              if unix_ms <= 0 {
                  return "-".to_owned();
              }
              Local
                  .timestamp_millis_opt(unix_ms)
                  .single()
                  .map(|value| value.format("%Y-%m-%d %H:%M").to_string())
                  .unwrap_or_else(|| "-".to_owned())
          }

          fn format_byte_count(bytes: u64) -> String {
              const KB: f64 = 1024.0;
              const MB: f64 = KB * 1024.0;
              const GB: f64 = MB * 1024.0;
              let value = bytes as f64;
              if value >= GB {
                  format!("{:.2} GB", value / GB)
              } else if value >= MB {
                  format!("{:.1} MB", value / MB)
              } else if value >= KB {
                  format!("{:.1} KB", value / KB)
              } else {
                  format!("{bytes} B")
              }
          }

