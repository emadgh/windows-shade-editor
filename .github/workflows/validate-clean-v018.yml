name: Validate Clean Shade Editor v0.18.0

permissions:
  contents: write

on:
  push:
    branches:
      - hardening/v0.18

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check Windows target locked
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test Windows target locked
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Verify clean production tree
        shell: pwsh
        run: |
          $forbidden = @(
            'phase4-test.log',
            'phase5-test.log',
            'tools/apply_phase1_hardening.py',
            'tools/apply_production_upgrade.py',
            '.github/workflows/phase5-hardening.yml',
            '.github/workflows/finalize-v018.yml'
          )
          foreach ($path in $forbidden) {
            if (Test-Path $path) { throw "Temporary file remains in production tree: $path" }
          }
          if ((Get-Content -Raw VERSION).Trim() -ne '0.18.0') { throw 'VERSION mismatch' }
          if (-not (Select-String -Quiet -Path Cargo.toml -Pattern 'version = "0.18.0"')) { throw 'Cargo.toml version mismatch' }
          if (-not (Select-String -Quiet -Path Cargo.lock -Pattern 'version = "0.18.0"')) { throw 'Cargo.lock version mismatch' }
          if ((Get-Content RELEASE_NOTES.md -TotalCount 1) -ne '# Shade Editor 0.18.0') { throw 'Release notes version mismatch' }
      - name: Remove temporary clean-tree workflow
        shell: pwsh
        run: git rm .github/workflows/validate-clean-v018.yml
      - name: Commit clean validated tree
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Validate clean Shade Editor v0.18.0 tree"
          git push origin HEAD:hardening/v0.18
