name: Apply Shade Editor v0.6.0 source patch fixed

on:
  push:
    branches:
      - feat/default-dpi-channel-palettes
    paths:
      - .github/workflows/apply-v060-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/default-dpi-channel-palettes
          fetch-depth: 0
      - name: Fix migration script ambiguities
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v060.py')
          s = p.read_text(encoding='utf-8')

          old = '''app = replace_once(app, ".then(|| channel_color(&output_name, self.selected_channel));", ".then(|| channel_color(palette.as_ref(), &output_name, self.selected_channel));", "adjustment control palette")
          app = replace_once(app, ".then(|| channel_color(&output_name, self.selected_channel));", ".then(|| channel_color(palette.as_ref(), &output_name, self.selected_channel));", "adjustment panel palette")'''
          new = '''needle = ".then(|| channel_color(&output_name, self.selected_channel));"
          if app.count(needle) != 2:
              raise SystemExit(f"adjustment palette accents: expected 2 matches, found {app.count(needle)}")
          app = app.replace(needle, ".then(|| channel_color(palette.as_ref(), &output_name, self.selected_channel));", 2)'''
          if old not in s:
              raise SystemExit('accent script patch target not found')
          s = s.replace(old, new, 1)

          old = 'changed |= mixer_ui(ui, adjustment, output_name, channel_names, accent);",'
          new = 'changed |= mixer_ui(ui, adjustment, output_name, channel_names, accent, palette);",'
          if old not in s:
              raise SystemExit('all mixers script call target not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply patch
        run: python tools/apply_v060.py
      - name: Format Rust
        run: cargo fmt
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src/app_main.rs src/model_v6.rs src/export_v6.rs src/dpi.rs src/palette.rs src/settings_v6.rs
          git commit -m "Apply default DPI and channel palette workflow [v060-applied]" || exit 0
          git push origin HEAD:feat/default-dpi-channel-palettes
