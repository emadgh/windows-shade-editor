name: Validate Phase 0 Production Hardening

permissions:
  contents: write

on:
  push:
    branches:
      - hardening/v0.18

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Apply Phase 0 migration
        run: python tools/apply_phase0_hardening.py

      - name: Format
        run: cargo fmt --all

      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Test Windows target
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Remove temporary Phase 0 infrastructure
        shell: pwsh
        run: |
          git rm tools/apply_phase0_hardening.py
          git rm .github/workflows/phase0-hardening.yml

      - name: Commit validated Phase 0 source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Phase 0: harden project lifecycle and export safety"
          git push origin HEAD:hardening/v0.18
