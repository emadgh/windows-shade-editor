name: Fix Shade Editor Shell v0.12 compilation

on:
  push:
    branches: [feat/v012-windows-shell-integration]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v012-windows-shell-integration
          fetch-depth: 0
      - name: Patch COM source
        shell: pwsh
        run: |
          $path = 'shell/ShadeEditorShell.cpp'
          $text = Get-Content -Raw $path
          if (-not $text.Contains('#define NOMINMAX')) {
            $text = [regex]::Replace($text, '(?m)^#define WIN32_LEAN_AND_MEAN\r?$', "#define WIN32_LEAN_AND_MEAN`n#define NOMINMAX", 1)
          }
          $text = $text.Replace('~ShadeShellHandler() override', '~ShadeShellHandler()')
          $text = $text.Replace('~ShadeClassFactory() override', '~ShadeClassFactory()')
          $text = $text.Replace('extern "C" __declspec(dllexport) HRESULT __stdcall DllCanUnloadNow()', 'STDAPI DllCanUnloadNow()')
          $text = $text.Replace('extern "C" __declspec(dllexport) HRESULT __stdcall DllGetClassObject(', 'STDAPI DllGetClassObject(')
          if ($text.Contains('~ShadeShellHandler() override') -or $text.Contains('~ShadeClassFactory() override')) { throw 'destructor patch failed' }
          if ($text.Contains('extern "C" __declspec(dllexport) HRESULT __stdcall DllCanUnloadNow')) { throw 'COM export patch failed' }
          Set-Content -NoNewline -Encoding utf8 $path $text
      - name: Compile parser, COM DLL and COM tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist shell\bin mkdir shell\bin
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeProjectDataTests.exe shell\ShadeProjectDataTests.cpp shell\ShadeProjectData.cpp
          if errorlevel 1 exit /b 1
          shell\bin\ShadeProjectDataTests.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /LD /Fe:shell\bin\ShadeEditorShell.dll shell\ShadeEditorShell.cpp shell\ShadeProjectData.cpp /link /EXPORT:DllCanUnloadNow /EXPORT:DllGetClassObject ole32.lib shlwapi.lib windowscodecs.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeShellTests.exe shell\ShadeShellTests.cpp /link ole32.lib shlwapi.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          shell\bin\ShadeShellTests.exe shell\bin\ShadeEditorShell.dll
          if errorlevel 1 exit /b 1
      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shell/ShadeEditorShell.cpp
          git commit -m "Fix native shell COM compilation"
          git push origin HEAD:feat/v012-windows-shell-integration
