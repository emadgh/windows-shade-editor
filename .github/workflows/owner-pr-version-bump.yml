name: Owner PR patch version bump

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: owner-pr-version-bump-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/bump-patch' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: windows-latest
    steps:
      - name: Resolve owner-authored same-repository PR head
        id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER"
          if ($pr.state -ne 'open') { throw "PR is not open." }
          if ($pr.base.ref -ne 'main') { throw "Version helper only supports PRs targeting main." }
          if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) {
            throw "Refusing to write to a fork PR."
          }
          if ($pr.user.login -ne $env:GITHUB_REPOSITORY_OWNER) {
            throw "Refusing to execute PR code with a version-bump write workflow unless the PR author is the repository owner."
          }
          if ($pr.head.ref -eq 'main') { throw "Refusing to bump main directly." }
          "head_ref=$($pr.head.ref)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_sha=$($pr.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Bump patch version and regenerate lock identity
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content -Raw VERSION).Trim()
          $semanticVersion = [regex]::Match($current, '^(\d+)\.(\d+)\.(\d+)$')
          if (-not $semanticVersion.Success) {
            throw "VERSION is not a strict semantic patch version: '$current'"
          }
          $major = $semanticVersion.Groups[1].Value
          $minor = $semanticVersion.Groups[2].Value
          $patch = [int]$semanticVersion.Groups[3].Value
          $next = "$major.$minor.$($patch + 1)"

          $cargo = Get-Content -Raw Cargo.toml
          $pattern = '(?m)^version = "' + [regex]::Escape($current) + '"$'
          $packageVersionMatches = [regex]::Matches($cargo, $pattern)
          if ($packageVersionMatches.Count -ne 1) {
            throw "Expected exactly one root Cargo.toml package version '$current'; found $($packageVersionMatches.Count)."
          }
          $cargo = [regex]::Replace($cargo, $pattern, "version = `"$next`"", 1)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'Cargo.toml'), $cargo, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Join-Path $PWD 'VERSION'), $next, [System.Text.ASCIIEncoding]::new())

          # Cargo is the authority for the lockfile representation of the root package.
          cargo check --target x86_64-pc-windows-msvc

          $lock = Get-Content -Raw Cargo.lock
          $packageBlocks = [regex]::Matches($lock, '(?ms)^\[\[package\]\]\s*(.*?)(?=^\[\[package\]\]|\z)')
          $lockVersion = $null
          foreach ($block in $packageBlocks) {
            if ($block.Value -match '(?m)^name = "windows-shade-editor"\s*$') {
              $versionMatch = [regex]::Match($block.Value, '(?m)^version = "([^"]+)"\s*$')
              if ($versionMatch.Success) { $lockVersion = $versionMatch.Groups[1].Value; break }
            }
          }
          if ($lockVersion -ne $next) {
            throw "Cargo.lock root package version '$lockVersion' does not match '$next'."
          }

          $allowed = @('Cargo.toml', 'Cargo.lock', 'VERSION')
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3).Trim() })
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected files changed during version bump: $($unexpected -join ', ')"
          }
          foreach ($required in $allowed) {
            if ($required -notin $changed) { throw "Expected version file did not change: $required" }
          }

          "next=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate exact bumped identity with locked Cargo
        shell: pwsh
        run: |
          cargo check --locked --target x86_64-pc-windows-msvc

      - name: Commit version bump to PR branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock VERSION
          git diff --cached --check
          git commit -m "chore: bump Shade Editor to v${{ steps.version.outputs.next }}"

          # Inject the write credential only for the final push step. PR-controlled
          # Cargo/build code never runs with a persisted write credential.
          $remote = "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git push $remote HEAD:${{ steps.pr.outputs.head_ref }}
