name: Apply Shade Editor v0.7.1 compact adjustment UI v2

on:
  push:
    branches:
      - feat/compact-adjustment-resets

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/compact-adjustment-resets
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/apply_v071.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit source
        shell: bash
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app_main.rs src/settings_v6.rs Cargo.toml RELEASE_NOTES.md
          git commit -m "Add compact adjustment controls and header resets"
          git push origin HEAD:feat/compact-adjustment-resets
