name: Temporary guarded PR328 recovery UI patch

on:
  pull_request:
    branches:
      - tmp/pr328-recovery-ui-workflow

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/pr328-recovery-ui-workflow
          path: helper
      - uses: actions/checkout@v6
        with:
          ref: codex/color-conversion-project-recovery
          fetch-depth: 0
          path: work
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Patch explicit project-only recovery UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location work
          $expected = 'b0dfd30dde9dfb5a87983e9e41f52aae8fb87574'
          if ((git rev-parse HEAD).Trim() -ne $expected) { throw 'PR328 head moved before guarded UI patch' }
          Set-Location ..
          python helper/tools/tmp_pr328_recovery_ui_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location work
          rustfmt --edition 2024 src/ui/color_conversion.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'src/ui/color_conversion.rs') {
            throw "Recovery UI patch changed unexpected files: $($changed -join ', ')"
          }
          cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/color_conversion.rs
          git commit -m 'feat: expose project-only recovery action in Conversion Queue (#324)'
          git push origin HEAD:codex/color-conversion-project-recovery
