name: Temporary self-hosted PR310 implementation trigger

on:
  push:
    branches:
      - codex/fullres-png-jpeg-production-source
    paths:
      - .github/workflows/tmp-pr310-self.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fullres-png-jpeg-production-source
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Reuse guarded implementation script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin tmp/pr310-implementation-workflow:refs/remotes/origin/tmp/pr310-implementation-workflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git show origin/tmp/pr310-implementation-workflow:.github/workflows/tmp-pr310-implementation.yml | Out-File -FilePath "$env:RUNNER_TEMP/helper.yml" -Encoding utf8
          @'
          from pathlib import Path
          import os

          source = Path(os.environ['RUNNER_TEMP']).joinpath('helper.yml').read_text(encoding='utf-8-sig')
          marker = "      - name: Apply source adapter, validate, publish\n        shell: pwsh\n        run: |\n"
          if source.count(marker) != 1:
              raise SystemExit(f'helper step marker count was {source.count(marker)}, expected 1')
          tail = source.split(marker, 1)[1]
          body = []
          for line in tail.splitlines():
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          old_guard = "$expectedHead = '4afeeb0b32bee0b50b804150fe6fc618ed6dd02d'\nif ((git rev-parse HEAD).Trim() -ne $expectedHead) { throw 'PR310 feature head moved' }\n"
          new_guard = "$expectedParent = '4afeeb0b32bee0b50b804150fe6fc618ed6dd02d'\nif ((git rev-parse HEAD^).Trim() -ne $expectedParent) { throw 'PR310 workflow parent is not exact v0.21.45 main' }\n$changed = @(git diff --name-only HEAD^ HEAD)\nif ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/tmp-pr310-self.yml') { throw 'PR310 bootstrap commit contains unexpected files' }\n"
          if script.count(old_guard) != 1:
              raise SystemExit(f'guard marker count was {script.count(old_guard)}, expected 1')
          script = script.replace(old_guard, new_guard, 1)
          Path(os.environ['RUNNER_TEMP']).joinpath('pr310-self.ps1').write_text(script, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/pr310-self.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
