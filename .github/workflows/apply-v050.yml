name: Apply Shade Editor v0.5.0 source patch

on:
  push:
    branches:
      - feat/snapshot-export-curve-workflow
    paths:
      - tools/apply_v050.py
      - .github/workflows/apply-v050.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[v050-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/snapshot-export-curve-workflow
      - name: Apply patch
        run: python tools/apply_v050.py
      - name: Format Rust
        run: cargo fmt
      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml RELEASE_NOTES.md src/app_main.rs src/model_v5.rs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply snapshot export and Curve workflow [v050-applied]"
            git push origin HEAD:feat/snapshot-export-curve-workflow
          fi
