name: Apply v0.16 ICC preview and clipping

on:
  push:
    paths:
      - scripts/apply_v016_icc_clipping.py
      - scripts/trigger_v016_icc_clipping.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply source migration
        run: python scripts/apply_v016_icc_clipping.py
      - name: Correct clipping regression fixture
        shell: pwsh
        run: |
          $path = 'src/render.rs'
          $text = [System.IO.File]::ReadAllText($path)
          $old = 'let face = face(vec![0, 10000, 30000, 50000, 65535]);'
          $new = 'let face = face(vec![0, 10000, 30000, 55000, 65535]);'
          if (($text.Split($old).Count - 1) -ne 1) { throw 'Unexpected clipping fixture shape' }
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new))
      - name: Format
        run: cargo fmt --all
      - name: Resolve dependency lock and check Windows build
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Link release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock RELEASE_NOTES.md src/color_management.rs src/render.rs src/settings_v6.rs src/app_main.rs
          if (git diff --cached --quiet) { throw "v0.16 migration produced no source changes" }
          git commit -m "Add ICC-aware preview and per-channel clipping warnings"
          git push origin HEAD:main
