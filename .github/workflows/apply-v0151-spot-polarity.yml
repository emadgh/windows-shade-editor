name: Apply v0.15.2 Spot polarity migration

on:
  push:
    paths:
      - scripts/apply_v0151_spot_polarity.py
      - scripts/run_v0152_spot_polarity.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply source migration
        shell: pwsh
        run: python scripts/run_v0152_spot_polarity.py
      - name: Format
        run: cargo fmt --all
      - name: Check locked Windows build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/tiff_io.rs src/render.rs src/export_v6.rs
          if (git diff --cached --quiet) { throw "Spot polarity migration produced no source changes" }
          git commit -m "Normalize Photoshop Spot polarity in preview and export"
          git push origin HEAD:main
