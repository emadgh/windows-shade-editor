name: Validate typed UI actions v0.20.0

on:
  push:
    branches:
      - refactor/v020-typed-ui-actions

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize generated typed-action source and guards
        shell: pwsh
        run: |
          $path = '.github/scripts/apply_v020_typed_ui_actions.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace('NavigationUiAction::QuickSave => self.quick_save_project(),', "NavigationUiAction::QuickSave => {`n                self.quick_save_project();`n            }")
          $text = $text.Replace('NavigationUiAction::Save => self.save_project(false),', "NavigationUiAction::Save => {`n                self.save_project(false);`n            }")
          $text = $text.Replace('NavigationUiAction::SaveAs => self.save_project(true),', "NavigationUiAction::SaveAs => {`n                self.save_project(true);`n            }")
          $text = $text.Replace('"app.current_face =",', '"app.current_face = index;",')
          Set-Content -Path $path -Value $text -NoNewline
      - name: Apply typed UI action refactor
        run: python .github/scripts/apply_v020_typed_ui_actions.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check Release graph
        run: cargo check --release --locked
      - name: Full Release tests
        run: cargo test --release --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Validate version and typed-action architecture
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          $version = (Get-Content VERSION -Raw).Trim()
          if ($cargo -ne '0.20.0' -or $version -ne '0.20.0') { throw "Version mismatch: Cargo=$cargo VERSION=$version" }
          if (-not (Select-String -Path src/ui/actions.rs -Pattern 'enum FaceUiAction' -Quiet)) { throw 'FaceUiAction missing' }
          if (-not (Select-String -Path src/ui/actions.rs -Pattern 'enum NavigationUiAction' -Quiet)) { throw 'NavigationUiAction missing' }
          if (-not (Select-String -Path src/ui/actions.rs -Pattern 'enum ProjectViewUiAction' -Quiet)) { throw 'ProjectViewUiAction missing' }
      - name: Commit validated typed-action refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): route cross-domain mutations through typed actions (#50, #52)"
          git push
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v0.20.0-windows-x64
          path: target/release/ShadeEditor.exe
          if-no-files-found: error
