name: Apply Issue 370 Patch

on:
  push:
    branches:
      - codex/issue-370-preview-cache-source-icc-policy

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue-370-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-370-preview-cache-source-icc-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply focused source patch
        run: python scripts/issue370_patch.py
      - name: Verify intended diff
        run: |
          git status --short
          git diff --check
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix candidate preview cache and RGB ICC fallback [issue-370-patch]"
          git push origin HEAD:codex/issue-370-preview-cache-source-icc-policy
