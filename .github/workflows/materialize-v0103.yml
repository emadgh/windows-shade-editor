name: Materialize Shade Editor v0.10.3 source

on:
  push:
    branches: [feat/v0103-production-workflow]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0103-production-workflow
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shade-editor-windows
      - name: Generate validated v0.10.3 source
        shell: pwsh
        run: |
          cargo check --target x86_64-pc-windows-msvc
          $generated = Get-ChildItem "target/x86_64-pc-windows-msvc/debug/build" -Recurse -Filter "app_main_v0103.rs" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $generated) { throw "Generated app_main_v0103.rs was not found" }
          $out = $generated.Directory.FullName
          $app = [IO.File]::ReadAllText($generated.FullName)
          $app = [regex]::Replace($app, '^// @generated[^\r\n]*\r?\n', '')
          $app = [regex]::Replace($app, '#\[path = "[^"]*/src/([^"]+)"\]\r?\nmod ([A-Za-z0-9_]+);', '#[path = "$1"]' + "`n" + 'mod $2;')
          $app = '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]' + "`n`n" + $app
          [IO.File]::WriteAllText("src/app_main.rs", $app, [Text.UTF8Encoding]::new($false))
          Copy-Item (Join-Path $out "settings_v0103.rs") "src/settings_v6.rs" -Force
          Copy-Item (Join-Path $out "validation_v0103.rs") "src/validation.rs" -Force
          $cargo = [IO.File]::ReadAllText("Cargo.toml")
          $cargo = [regex]::Replace($cargo, '(?m)^build = "build_wrapper\.rs"\r?\n', '')
          $cargo = $cargo.Replace('path = "src/entry_v0103.rs"', 'path = "src/app_main.rs"')
          [IO.File]::WriteAllText("Cargo.toml", $cargo, [Text.UTF8Encoding]::new($false))
          Remove-Item "build.rs", "build_wrapper.rs", "src/entry_v0103.rs" -Force
          cargo fmt --all
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Commit clean source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/app_main.rs src/settings_v6.rs src/validation.rs src/workflow_v0103.rs .gitattributes
          git rm build.rs build_wrapper.rs src/entry_v0103.rs .github/workflows/materialize-v0103.yml
          git commit -m "Materialize Shade Editor v0.10.3 source"
          git push origin HEAD:feat/v0103-production-workflow
