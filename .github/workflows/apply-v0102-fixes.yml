name: Apply Shade Editor v0.10.2 production fixes

on:
  push:
    branches: [fix/v0102-export-preview-testcode]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0102-export-preview-testcode
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shade-editor-windows
      - name: Apply and validate v0.10.2
        shell: pwsh
        run: |
          python scripts/apply_v0102_fixes.py
          python scripts/fix_v0102_compile.py
          python scripts/fix_v0102_predictor.py
          python scripts/fix_v0102_predictor_tag.py
          cargo fmt --all
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
      - name: Commit validated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/app_main.rs src/model_v6.rs src/export_v6.rs src/validation.rs RELEASE_NOTES.md docs/ROADMAP.md
          git rm scripts/apply_v0102_fixes.py scripts/fix_v0102_compile.py scripts/fix_v0102_predictor.py scripts/fix_v0102_predictor_tag.py .github/workflows/apply-v0102-fixes.yml
          git commit -m "Fix compressed TIFF export and preview workflow"
          git push origin HEAD:fix/v0102-export-preview-testcode
