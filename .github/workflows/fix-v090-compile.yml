name: Fix Shade Editor v0.9 compile

on:
  push:
    branches: [feat/v090-production-workflow]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v090-production-workflow
          fetch-depth: 0
      - name: Fix recovery ownership once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app_main.rs')
          s=p.read_text()
          old='''                let mut project = candidate.project;\n                let paths = candidate.resolved_face_paths();'''
          new='''                let paths = candidate.resolved_face_paths();\n                let origin_path = candidate.origin_path();\n                let mut project = candidate.project;'''
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace('''                    origin_path: candidate.origin_path(),\n                    project,''','''                    origin_path,\n                    project,''',1)
          p.write_text(s)
          PY
          cargo fmt --all
          if git diff --quiet; then
            echo "No compile fix needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs
          git commit -m "Fix recovery payload ownership"
          git push origin HEAD:feat/v090-production-workflow
