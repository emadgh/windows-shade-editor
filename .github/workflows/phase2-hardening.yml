name: Validate Phase 2 Color Management

permissions:
  contents: write

on:
  push:
    branches:
      - hardening/v0.18

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply Phase 2 migration
        run: python tools/apply_phase2_hardening.py
      - name: Format
        run: cargo fmt --all
      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Test Windows target
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Remove temporary Phase 2 infrastructure
        shell: pwsh
        run: |
          git rm tools/apply_phase2_hardening.py
          git rm .github/workflows/phase2-hardening.yml
      - name: Commit validated Phase 2 source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Phase 2: complete preview color management"
          git push origin HEAD:hardening/v0.18
