name: Validate v0.18.2 Snapshot Preview Cache

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v0182-snapshot-preview-cache

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply snapshot preview cache patch
        run: python tools/apply_v0182_snapshot_cache.py
      - name: Refresh lockfile
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Format
        run: cargo fmt --all
      - name: Check Windows target locked
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test Windows target locked
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build Windows release locked
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify snapshot cache invariants
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne '0.18.2') { throw 'VERSION mismatch' }
          if (-not (Select-String -Quiet -Path Cargo.toml -Pattern 'version = "0.18.2"')) { throw 'Cargo.toml version mismatch' }
          if (-not (Select-String -Quiet -Path Cargo.lock -Pattern 'version = "0.18.2"')) { throw 'Cargo.lock version mismatch' }
          if (-not (Test-Path src/snapshot_preview_cache.rs)) { throw 'snapshot preview cache module missing' }
          if (-not (Select-String -Quiet -Path src/main.rs -Pattern 'restore_active_snapshot_preview')) { throw 'snapshot cache restore wiring missing' }
          if (-not (Select-String -Quiet -Path src/workflow.rs -Pattern 'preview cache refreshed')) { throw 'snapshot Update cache refresh missing' }
          if (-not (Select-String -Quiet -Path src/main.rs -Pattern 'adjusted_histograms')) { throw 'histogram cache wiring missing' }
          if (-not (Select-String -Quiet -Path src/snapshot_preview_cache.rs -Pattern 'DEFAULT_MAX_BYTES')) { throw 'cache memory bound missing' }
      - name: Remove temporary patch infrastructure
        shell: pwsh
        run: |
          git rm .github/workflows/apply-v0182-snapshot-cache.yml
          git rm tools/apply_v0182_snapshot_cache.py
      - name: Commit validated v0.18.2 source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Shade Editor v0.18.2 snapshot preview cache"
          git push origin HEAD:fix/v0182-snapshot-preview-cache
