name: Temporary guarded PR268 v0.21.41 bump

on:
  pull_request:
    branches:
      - tmp/pr268-v02141-bump

permissions:
  contents: write

jobs:
  bump:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/color-conversion-windows-output-path-validation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Regenerate verify and publish version identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '9f9414febb7857dd77a7edd8b1f13beb65bfa0c0'
          if ((git rev-parse HEAD).Trim() -ne $expectedHead) { throw 'PR268 feature head moved' }
          Copy-Item Cargo.lock "$env:RUNNER_TEMP/Cargo.lock.before"
          @'
          from pathlib import Path
          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          old = 'version = "0.21.40"'
          new = 'version = "0.21.41"'
          if text.count(old) != 1:
              raise SystemExit(f'Cargo.toml root version marker count was {text.count(old)}, expected 1')
          cargo.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          version = Path('VERSION')
          if version.read_text(encoding='utf-8').strip() != '0.21.40':
              raise SystemExit('VERSION was not 0.21.40 at guarded head')
          version.write_text('0.21.41\n', encoding='utf-8', newline='\n')
          '@ | python -
          cargo check --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import copy
          import os
          import tomllib
          from pathlib import Path
          before = tomllib.loads(Path(os.environ['RUNNER_TEMP']).joinpath('Cargo.lock.before').read_text(encoding='utf-8'))
          after = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          def scrub(value, expected_version):
              value = copy.deepcopy(value)
              roots = [p for p in value.get('package', []) if p.get('name') == 'windows-shade-editor']
              if len(roots) != 1:
                  raise SystemExit(f'Expected exactly one root package in Cargo.lock, got {len(roots)}')
              if roots[0].get('version') != expected_version:
                  raise SystemExit(f'Root lock version was {roots[0].get("version")}, expected {expected_version}')
              roots[0]['version'] = '__ROOT_VERSION__'
              return value
          if scrub(before, '0.21.40') != scrub(after, '0.21.41'):
              raise SystemExit('Cargo.lock changed beyond the root package version')
          '@ | python -
          $changed = @(git diff --name-only)
          $expectedFiles = @('Cargo.lock', 'Cargo.toml', 'VERSION')
          if ((($changed | Sort-Object) -join "`n") -ne (($expectedFiles | Sort-Object) -join "`n")) {
            throw "Unexpected version-bump surface: $($changed -join ', ')"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock VERSION
          git commit -m 'chore: finalize v0.21.41 Windows conversion output path validation'
          git push origin HEAD:fix/color-conversion-windows-output-path-validation
