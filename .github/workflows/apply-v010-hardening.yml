name: Apply Shade Editor v0.10 production hardening

on:
  push:
    branches: [feat/v010-production-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v010-production-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shade-editor-windows
      - name: Apply and validate v0.10 hardening
        shell: pwsh
        run: |
          $parts = Get-ChildItem scripts/v010_part_*.txt | Sort-Object Name
          $patch = Join-Path $env:RUNNER_TEMP 'apply_v010_hardening.py'
          $content = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [System.IO.File]::WriteAllText($patch, $content, [System.Text.UTF8Encoding]::new($false))
          python $patch
          cargo fmt --all
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
      - name: Commit validated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/build-windows.yml
          git add Cargo.toml RELEASE_NOTES.md README.md docs/ARCHITECTURE.md docs/PRODUCTION_VALIDATION.md src/tiff_io.rs src/render.rs src/app_main.rs src/export_v6.rs src/update_v4.rs
          git rm scripts/v010_part_*.txt
          git commit -m "Harden Photoshop TIFF production interchange"
          git push origin HEAD:feat/v010-production-hardening
