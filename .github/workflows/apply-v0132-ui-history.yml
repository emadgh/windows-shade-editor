name: Apply v0.13.2 UI and history patch

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Previous Shades list thumbnail aspect fix'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply aspect-ratio fix
        run: python scripts/fix_v0132_list_thumbnail_aspect.py
      - name: Format
        run: rustfmt --edition 2024 src/app_main.rs
      - name: Check locked Windows build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path src/app_main.rs -Pattern 'from_center_size\(thumb_rect.center\(\), natural \* scale\)' | Out-Null
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs
          git commit -m "Preserve Previous Shades thumbnail aspect ratio"
          git push
