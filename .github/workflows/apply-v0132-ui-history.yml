name: Apply v0.13.2 UI and history patch

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry v0.13.2 UI and history patch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Fix patch matcher
        run: python scripts/fix_v0132_patcher.py
      - name: Apply source patch
        run: python scripts/apply_v0132_previous_shades_ui.py
      - name: Format
        run: rustfmt --edition 2024 src/app_main.rs src/previous_shades.rs src/thumbnail.rs src/settings_v6.rs
      - name: Check locked Windows build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path src/thumbnail.rs -Pattern 'THUMBNAIL_MAX_DIMENSION: usize = 512' | Out-Null
          Select-String -Path src/settings_v6.rs -Pattern 'export_all_test_code' | Out-Null
          Select-String -Path src/previous_shades.rs -Pattern 'SNAPSHOT_CACHE_VERSION: u32 = 2' | Out-Null
          Select-String -Path Cargo.toml -Pattern 'version = "0.13.2"' | Out-Null
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs src/previous_shades.rs src/thumbnail.rs src/settings_v6.rs Cargo.toml Cargo.lock RELEASE_NOTES.md
          git commit -m "Improve Previous Shades and adjustment workflow"
          git push
