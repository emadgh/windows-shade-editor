name: Apply Shade Editor v0.12 source integration

on:
  push:
    branches: [feat/v012-windows-shell-integration]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v012-windows-shell-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply source changes
        run: python scripts/apply_v012_source.py
      - name: Format check and test
        run: |
          cargo fmt --all
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/app_main.rs RELEASE_NOTES.md docs/ROADMAP.md
          git commit -m "Integrate Windows Shell source support into v0.12"
          git push origin HEAD:feat/v012-windows-shell-integration
