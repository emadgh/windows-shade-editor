name: Apply Shade Editor v0.12 integration v2

on:
  push:
    branches: [feat/v012-windows-shell-integration]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v012-windows-shell-integration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Patch app and build
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8').replace('\r\n', '\n')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          cargo = read('Cargo.toml').replace('version = "0.11.0"', 'version = "0.12.0"', 1)
          write('Cargo.toml', cargo)
          lock = read('Cargo.lock')
          lock = lock.replace('name = "windows-shade-editor"\nversion = "0.11.0"', 'name = "windows-shade-editor"\nversion = "0.12.0"', 1)
          write('Cargo.lock', lock)

          app = read('src/app_main.rs')
          main_start = app.index('fn main() -> eframe::Result {')
          main_end = app.index('\n}\n\n#[derive', main_start) + 2
          new_main = '''fn main() -> eframe::Result {
              let startup_project = std::env::args_os()
                  .nth(1)
                  .map(PathBuf::from)
                  .filter(|path| {
                      path.extension()
                          .and_then(|ext| ext.to_str())
                          .is_some_and(|ext| ext.eq_ignore_ascii_case("shade"))
                  });
              let native_options = eframe::NativeOptions {
                  renderer: eframe::Renderer::Glow,
                  viewport: egui::ViewportBuilder::default()
                      .with_title("Shade Editor")
                      .with_inner_size([1550.0, 920.0])
                      .with_min_inner_size([1100.0, 700.0]),
                  ..Default::default()
              };

              eframe::run_native(
                  "Shade Editor",
                  native_options,
                  Box::new(move |cc| {
                      let mut app = ShadeApp::new(cc);
                      if let Some(path) = startup_project.clone() {
                          app.open_project_path(path);
                      }
                      Ok(Box::new(app))
                  }),
              )
          }'''
          app = app[:main_start] + new_main + app[main_end:]

          open_start = app.index('    fn open_project_dialog(&mut self) {')
          open_end = app.index('\n    fn save_project(&mut self, save_as: bool)', open_start)
          new_open = '''    fn open_project_dialog(&mut self) {
              if self.job.is_some() {
                  return;
              }
              let Some(path) = rfd::FileDialog::new()
                  .add_filter("Shade project", &["shade"])
                  .pick_file()
              else {
                  return;
              };
              self.open_project_path(path);
          }

          fn open_project_path(&mut self, path: PathBuf) {
              if self.job.is_some() {
                  return;
              }
              self.recovery_candidate = None;
              let max_dimension = self.settings.max_preview_dimension;
              let default_dpi = self.settings.default_dpi;
              self.launch_job("Opening project", move |progress| {
                  let result = (|| -> Result<OpenPayload, String> {
                      Self::set_progress(&progress, None, "Opening project", "Reading .shade");
                      let mut project = ShadeProject::load(&path)?;
                      let resolved = project.resolve_face_paths(&path);
                      let total = resolved.len().max(1);
                      let mut faces = Vec::new();
                      let mut errors = Vec::new();
                      for (index, source) in resolved.into_iter().enumerate() {
                          Self::set_progress(
                              &progress,
                              Some(index as f32 / total as f32),
                              "Opening project",
                              &source
                                  .file_name()
                                  .map(|n| n.to_string_lossy().into_owned())
                                  .unwrap_or_default(),
                          );
                          let expected = project
                              .file_metadata
                              .as_ref()
                              .and_then(|metadata| metadata.faces.get(index))
                              .cloned();
                          match tiff_io::load_preview(&source, max_dimension) {
                              Ok(preview) => {
                                  project.ensure_channels(&preview.metadata.channel_names);
                                  faces.push(LoadedFace {
                                      dpi: dpi::read_dpi(&source, default_dpi),
                                      path: source,
                                      available: true,
                                      preview,
                                  });
                              }
                              Err(err) => {
                                  errors.push(format!("{}: {err}", source.display()));
                                  faces.push(workflow_v0103::placeholder_loaded_face(
                                      source,
                                      expected.as_ref(),
                                      default_dpi,
                                  ));
                              }
                          }
                      }
                      Self::set_progress(&progress, Some(1.0), "Opening project", "Complete");
                      Ok(OpenPayload { path, project, faces, errors })
                  })();
                  JobResult::Open(result)
              });
          }
          '''
          app = app[:open_start] + new_open + app[open_end:]
          write('src/app_main.rs', app)

          notes = read('RELEASE_NOTES.md')
          if not notes.startswith('# Shade Editor v0.12.0'):
              notes = '''# Shade Editor v0.12.0

          - Adds a native x64 Windows Shell extension for `.shade` files without loading the editor UI runtime inside Explorer.
          - Explorer thumbnails use the PNG already embedded in schema-v9 `.shade` projects through `IThumbnailProvider` and WIC.
          - A read-only `IPropertyStore` exposes Face count, active Face, physical/pixel dimensions, DPI, bit depth, color model, channel counts, source TIFF name, total source bytes, and save time.
          - Ships a custom Windows Property System `.propdesc` schema for Explorer Details/columns/search metadata.
          - Adds an elevated installer for COM/property-handler registration and per-user `.shade` file association.
          - Shade Editor accepts a `.shade` path as its first command-line argument so Explorer double-click can open the selected project.
          - Native parser and COM/WIC regression tests validate schema-v9 metadata and the embedded PNG thumbnail.
          - `.shade` schema remains v9.

          ''' + notes
          write('RELEASE_NOTES.md', notes)

          road = read('docs/ROADMAP.md')
          old_native = '''## Native Windows integration

          - Windows Explorer `.shade` thumbnail provider using the embedded project PNG.
          - Windows Property Handler exposing physical/pixel dimensions, DPI, bit depth, channel/Face counts, and save metadata.
          '''
          new_native = '''## Native Windows integration

          - Implemented in v0.12: native `.shade` thumbnail provider and read-only Windows Property Handler using the embedded PNG and cached project metadata.
          - Remaining validation: clean-workstation install, Explorer thumbnail cache, Details columns/search indexing, file association, upgrade, and removal while the Shell DLL may be loaded.
          '''
          if old_native in road:
              road = road.replace(old_native, new_native, 1)
          write('docs/ROADMAP.md', road)

          wf = read('.github/workflows/build-windows.yml')
          build_anchor = '      - name: Build release\n        run: cargo build --release --target x86_64-pc-windows-msvc\n'
          shell_steps = '''      - name: Build and test native Shell extension
              shell: cmd
              run: |
                for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
                if not defined VSINSTALL exit /b 1
                call "%VSINSTALL%\\VC\\Auxiliary\\Build\\vcvars64.bat"
                if not exist shell\\bin mkdir shell\\bin
                cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\\bin\\ShadeProjectDataTests.exe shell\\ShadeProjectDataTests.cpp shell\\ShadeProjectData.cpp
                if errorlevel 1 exit /b 1
                shell\\bin\\ShadeProjectDataTests.exe
                if errorlevel 1 exit /b 1
                cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /LD /Fe:shell\\bin\\ShadeEditorShell.dll shell\\ShadeEditorShell.cpp shell\\ShadeProjectData.cpp /link /EXPORT:DllCanUnloadNow /EXPORT:DllGetClassObject ole32.lib shlwapi.lib windowscodecs.lib propsys.lib gdi32.lib
                if errorlevel 1 exit /b 1
                cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\\bin\\ShadeShellTests.exe shell\\ShadeShellTests.cpp /link ole32.lib shlwapi.lib propsys.lib gdi32.lib
                if errorlevel 1 exit /b 1
                shell\\bin\\ShadeShellTests.exe shell\\bin\\ShadeEditorShell.dll
                if errorlevel 1 exit /b 1
            - name: Validate Shell property schema XML
              shell: pwsh
              run: |
                [xml](Get-Content -Raw shell/ShadeEditor.propdesc) | Out-Null
          '''
          # de-indent the literal above by four spaces introduced for Python readability
          shell_steps = '\n'.join(line[4:] if line.startswith('    ') else line for line in shell_steps.splitlines()) + '\n'
          if 'Build and test native Shell extension' not in wf:
              if build_anchor not in wf:
                  raise RuntimeError('build workflow anchor missing')
              wf = wf.replace(build_anchor, build_anchor + shell_steps, 1)
          artifact_anchor = '          Copy-Item LICENSE artifact/LICENSE\n'
          shell_artifact = '''          New-Item -ItemType Directory -Force artifact/Shell | Out-Null
                    Copy-Item shell/bin/ShadeEditorShell.dll artifact/Shell/ShadeEditorShell.dll
                    Copy-Item shell/ShadeEditor.propdesc artifact/Shell/ShadeEditor.propdesc
                    Copy-Item shell/Install-ShadeEditorShell.ps1 artifact/Shell/Install-ShadeEditorShell.ps1
                    Copy-Item shell/README.md artifact/Shell/README.md
                    $shellHash = (Get-FileHash -Algorithm SHA256 shell/bin/ShadeEditorShell.dll).Hash.ToLowerInvariant()
                    "$shellHash  ShadeEditorShell.dll" | Set-Content -Encoding ascii -NoNewline artifact/Shell/ShadeEditorShell.dll.sha256
          '''
          shell_artifact = '\n'.join(line[10:] if line.startswith('          ') else line for line in shell_artifact.splitlines()) + '\n'
          # Restore the PowerShell indentation expected inside the existing run block.
          shell_artifact = ''.join('          ' + line + '\n' for line in shell_artifact.rstrip('\n').split('\n'))
          if 'artifact/Shell/ShadeEditorShell.dll' not in wf:
              if artifact_anchor not in wf:
                  raise RuntimeError('artifact workflow anchor missing')
              wf = wf.replace(artifact_anchor, artifact_anchor + shell_artifact, 1)
          write('.github/workflows/build-windows.yml', wf)
          '@ | Set-Content -Encoding utf8 .tmp_apply_v012.py
          python .tmp_apply_v012.py
          Remove-Item .tmp_apply_v012.py
          cargo fmt --all
      - name: Check and test Rust
        run: |
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
      - name: Commit v0.12 integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/app_main.rs RELEASE_NOTES.md docs/ROADMAP.md .github/workflows/build-windows.yml
          git commit -m "Integrate Windows Shell support into v0.12"
          git push origin HEAD:feat/v012-windows-shell-integration
