name: Temporary guarded PR328 v0.21.49 bump

on:
  pull_request:
    branches:
      - tmp/pr328-v02149-workflow

permissions:
  contents: write

jobs:
  bump:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/color-conversion-project-recovery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Bump exact version identity and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'ddf754a79a608d49ed0cbfa9120e4e29e68c72cf'
          if ((git rev-parse HEAD).Trim() -ne $expected) { throw 'PR328 head moved before version bump' }
          @'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          old = 'version = "0.21.48"'
          if text.count(old) < 1:
              raise SystemExit('Cargo.toml package version 0.21.48 not found')
          text = text.replace(old, 'version = "0.21.49"', 1)
          cargo.write_text(text, encoding='utf-8')

          lock = Path('Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = 'name = "windows-shade-editor"\nversion = "0.21.48"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one windows-shade-editor 0.21.48 package block, found {text.count(old)}')
          text = text.replace(old, 'name = "windows-shade-editor"\nversion = "0.21.49"', 1)
          lock.write_text(text, encoding='utf-8')

          version = Path('VERSION')
          if version.read_text(encoding='utf-8').strip() != '0.21.48':
              raise SystemExit('VERSION is not 0.21.48')
          version.write_text('0.21.49\n', encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $expectedFiles = @('Cargo.lock', 'Cargo.toml', 'VERSION')
          if ($changed.Count -ne 3) { throw "Version bump changed unexpected file count: $($changed -join ', ')" }
          foreach ($file in $changed) {
            if ($expectedFiles -notcontains $file) { throw "Version bump changed unexpected file: $file" }
          }
          if ((Get-Content VERSION -Raw).Trim() -ne '0.21.49') { throw 'VERSION mismatch after bump' }
          $manifestVersion = (Select-String -Path Cargo.toml -Pattern '^version = "0\.21\.49"$' | Select-Object -First 1)
          if (-not $manifestVersion) { throw 'Cargo.toml version mismatch after bump' }
          cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock VERSION
          git commit -m 'chore: bump Shade Editor to v0.21.49 (#324)'
          git push origin HEAD:codex/color-conversion-project-recovery
