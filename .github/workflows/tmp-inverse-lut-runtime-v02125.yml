name: Temporary guarded inverse LUT runtime v0.21.25 bump
on:
  pull_request:
    branches:
      - tmp/inverse-lut-runtime-v02125-bump
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  bump:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/custom-optimizer-inverse-lut-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Regenerate, verify and publish version identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '2f40a457e833d80a68083830d3a2e2921343cfee'
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -ne $expectedHead) {
            throw "Refusing version mutation: expected source head $expectedHead, got $actualHead"
          }

          $target = '0.21.25'
          $toml = Get-Content Cargo.toml -Raw
          $updated = $toml -replace '(?m)^version = "0\.21\.24"$', 'version = "0.21.25"'
          if ($updated -eq $toml) { throw 'Cargo.toml version anchor was not replaced exactly once.' }
          Set-Content Cargo.toml -Value $updated -NoNewline
          Set-Content VERSION -Value $target -NoNewline

          # Cargo itself owns lockfile regeneration.
          cargo check --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $changed = @(git diff --name-only)
          $expected = @('Cargo.lock','Cargo.toml','VERSION')
          if ((@($changed | Sort-Object) -join "`n") -ne (@($expected | Sort-Object) -join "`n")) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }

          $lockDiff = @(git diff --unified=0 -- Cargo.lock)
          $removed = @($lockDiff | Where-Object { $_ -match '^-version = "0\.21\.24"$' })
          $added = @($lockDiff | Where-Object { $_ -match '^\+version = "0\.21\.25"$' })
          $other = @($lockDiff | Where-Object {
            $_ -match '^[+-]' -and $_ -notmatch '^---' -and $_ -notmatch '^\+\+\+' -and
            $_ -notmatch '^-version = "0\.21\.24"$' -and $_ -notmatch '^\+version = "0\.21\.25"$'
          })
          if ($removed.Count -ne 1 -or $added.Count -ne 1 -or $other.Count -ne 0) {
            throw "Cargo.lock drift detected:`n$($lockDiff -join "`n")"
          }

          cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock VERSION
          git commit -m 'chore: bump inverse LUT runtime to v0.21.25'
          git push origin HEAD:codex/custom-optimizer-inverse-lut-runtime
