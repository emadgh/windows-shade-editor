name: Apply Shade Editor v0.6.1 vector icons

on:
  push:
    branches:
      - fix/vector-icons-no-font
    paths:
      - .github/workflows/apply-vector-icons-v061.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/vector-icons-no-font
          fetch-depth: 0
      - name: Apply vector icon patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/app_main.rs')
          app = app_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global app
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              app = app.replace(old, new, 1)

          replace_once(
          '''            export_all = ui
                          .add_enabled(
                              self.job.is_none() && !all_ids.is_empty() && !self.faces.is_empty(),
                              egui::Button::new("⇧").min_size(egui::vec2(20.0, 20.0)),
                          )
                          .on_hover_text("Export all snapshots for the active Face")
                          .clicked();
                      if all_exported {
                          open_all_folder = ui
                              .small_button("✓")
                              .on_hover_text("Open the latest export folder for these snapshots")
                              .clicked();
                      }''',
          '''            export_all = vector_icon_button(
                          ui,
                          VectorIcon::Export,
                          self.job.is_none() && !all_ids.is_empty() && !self.faces.is_empty(),
                          "Export all snapshots for the active Face",
                      )
                      .clicked();
                      if all_exported {
                          open_all_folder = vector_icon_button(
                              ui,
                              VectorIcon::Check,
                              true,
                              "Open the latest export folder for these snapshots",
                          )
                          .clicked();
                      }''',
          'snapshot panel icons')

          replace_once(
          '''                if ui
                              .add_enabled(
                                  self.job.is_none() && !day_ids.is_empty() && !self.faces.is_empty(),
                                  egui::Button::new("⇧").min_size(egui::vec2(20.0, 20.0)),
                              )
                              .on_hover_text("Export all snapshots from this day for the active Face")
                              .clicked()
                          {
                              requested_group_export = Some((day_ids.clone(), day.clone()));
                          }
                          if day_exported
                              && ui
                                  .small_button("✓")
                                  .on_hover_text("Open the latest export folder for this day")
                                  .clicked()
                          {
                              requested_folder = day_latest_folder.clone();
                          }''',
          '''                if vector_icon_button(
                              ui,
                              VectorIcon::Export,
                              self.job.is_none() && !day_ids.is_empty() && !self.faces.is_empty(),
                              "Export all snapshots from this day for the active Face",
                          )
                          .clicked()
                          {
                              requested_group_export = Some((day_ids.clone(), day.clone()));
                          }
                          if day_exported
                              && vector_icon_button(
                                  ui,
                                  VectorIcon::Check,
                                  true,
                                  "Open the latest export folder for this day",
                              )
                              .clicked()
                          {
                              requested_folder = day_latest_folder.clone();
                          }''',
          'snapshot day icons')

          replace_once(
          '''            let suffix = if index >= base_count {
                              "  • spot"
                          } else {
                              ""
                          };
                          let accent = channel_color(active_palette.as_ref(), name, index);
                          let is_solo = self.solo_channel == Some(index);
                          let indicator = if is_solo { "■" } else { "□" };
                          let display_name = channel_display_name(active_palette.as_ref(), name, index);
                          let label = format!("{indicator}  {display_name}{suffix}");
                          let response = clickable_row(
                              ui,
                              self.selected_channel == index,
                              &label,
                              None,
                              Some(accent),
                              32.0,
                          )
                          .on_hover_text("Click to select for editing. Click the active channel again to toggle solo preview.");''',
          '''            let suffix = if index >= base_count { "  [spot]" } else { "" };
                          let accent = channel_color(active_palette.as_ref(), name, index);
                          let is_solo = self.solo_channel == Some(index);
                          let display_name = channel_display_name(active_palette.as_ref(), name, index);
                          let label = format!("{display_name}{suffix}");
                          let response = channel_clickable_row(
                              ui,
                              self.selected_channel == index,
                              is_solo,
                              &label,
                              accent,
                              32.0,
                          )
                          .on_hover_text("Click to select for editing. Click the active channel again to toggle solo preview.");''',
          'channel vector solo indicator')

          replace_once(
          '''            UpdateStatus::UpToDate => {
                          if ui
                              .small_button("Update ✓")
                              .on_hover_text("Check again")
                              .clicked()
                          {
                              self.updater.start_check(false);
                          }
                      }''',
          '''            UpdateStatus::UpToDate => {
                          if ui
                              .small_button("Update OK")
                              .on_hover_text("Check again")
                              .clicked()
                          {
                              self.updater.start_check(false);
                          }
                      }''',
          'updater check glyph')

          replace_once('format!("Restart → {}", info.version)', 'format!("Restart to {}", info.version)', 'restart arrow')
          replace_once('format!("Empty → {fallback}")', 'format!("Empty = {fallback}")', 'test code arrow')

          replace_once(
          '''fn palette_entry_readonly(ui: &mut egui::Ui, entry: &palette::ChannelPaletteEntry) {
              let [r, g, b] = entry.color;
              ui.horizontal(|ui| {
                  ui.colored_label(egui::Color32::from_rgb(r, g, b), "■");
                  ui.label(&entry.name);
              });
          }

          fn clickable_row(''',
          '''fn palette_entry_readonly(ui: &mut egui::Ui, entry: &palette::ChannelPaletteEntry) {
              let [r, g, b] = entry.color;
              ui.horizontal(|ui| {
                  let color = egui::Color32::from_rgb(r, g, b);
                  let (rect, _) = ui.allocate_exact_size(egui::vec2(12.0, 12.0), egui::Sense::hover());
                  ui.painter().rect_filled(rect, 2.0, color);
                  ui.label(&entry.name);
              });
          }

          #[derive(Clone, Copy, PartialEq, Eq, Hash)]
          enum VectorIcon {
              Export,
              Check,
          }

          fn paint_vector_icon(
              painter: &egui::Painter,
              rect: egui::Rect,
              icon: VectorIcon,
              color: egui::Color32,
          ) {
              let rect = rect.shrink(5.0);
              let stroke = egui::Stroke::new(1.8, color);
              match icon {
                  VectorIcon::Export => {
                      let center_x = rect.center().x;
                      let arrow_top = rect.top() + 0.5;
                      let arrow_bottom = rect.center().y + 2.0;
                      painter.line_segment(
                          [egui::pos2(center_x, arrow_bottom), egui::pos2(center_x, arrow_top)],
                          stroke,
                      );
                      painter.line_segment(
                          [egui::pos2(center_x, arrow_top), egui::pos2(center_x - 3.4, arrow_top + 3.4)],
                          stroke,
                      );
                      painter.line_segment(
                          [egui::pos2(center_x, arrow_top), egui::pos2(center_x + 3.4, arrow_top + 3.4)],
                          stroke,
                      );
                      let tray_y = rect.bottom() - 0.5;
                      let tray_top = tray_y - 4.0;
                      painter.line_segment(
                          [egui::pos2(rect.left() + 0.5, tray_top), egui::pos2(rect.left() + 0.5, tray_y)],
                          stroke,
                      );
                      painter.line_segment(
                          [egui::pos2(rect.left() + 0.5, tray_y), egui::pos2(rect.right() - 0.5, tray_y)],
                          stroke,
                      );
                      painter.line_segment(
                          [egui::pos2(rect.right() - 0.5, tray_y), egui::pos2(rect.right() - 0.5, tray_top)],
                          stroke,
                      );
                  }
                  VectorIcon::Check => {
                      painter.line_segment(
                          [
                              egui::pos2(rect.left() + 1.0, rect.center().y),
                              egui::pos2(rect.center().x - 1.0, rect.bottom() - 1.5),
                          ],
                          egui::Stroke::new(2.0, color),
                      );
                      painter.line_segment(
                          [
                              egui::pos2(rect.center().x - 1.0, rect.bottom() - 1.5),
                              egui::pos2(rect.right() - 0.5, rect.top() + 1.0),
                          ],
                          egui::Stroke::new(2.0, color),
                      );
                  }
              }
          }

          fn paint_vector_icon_button(
              ui: &egui::Ui,
              rect: egui::Rect,
              response: &egui::Response,
              icon: VectorIcon,
              enabled: bool,
          ) {
              if enabled && response.hovered() {
                  ui.painter()
                      .rect_filled(rect, 4.0, ui.visuals().widgets.hovered.bg_fill);
              }
              let color = if enabled {
                  if response.hovered() {
                      ui.visuals().widgets.hovered.fg_stroke.color
                  } else {
                      ui.visuals().text_color()
                  }
              } else {
                  ui.visuals().weak_text_color().gamma_multiply(0.45)
              };
              paint_vector_icon(ui.painter(), rect, icon, color);
          }

          fn vector_icon_button(
              ui: &mut egui::Ui,
              icon: VectorIcon,
              enabled: bool,
              tooltip: &str,
          ) -> egui::Response {
              let sense = if enabled {
                  egui::Sense::click()
              } else {
                  egui::Sense::hover()
              };
              let (rect, response) = ui.allocate_exact_size(egui::vec2(24.0, 24.0), sense);
              paint_vector_icon_button(ui, rect, &response, icon, enabled);
              response.on_hover_text(tooltip)
          }

          fn vector_icon_button_at(
              ui: &mut egui::Ui,
              rect: egui::Rect,
              icon: VectorIcon,
              enabled: bool,
              tooltip: &str,
          ) -> egui::Response {
              let sense = if enabled {
                  egui::Sense::click()
              } else {
                  egui::Sense::hover()
              };
              let id = ui.id().with((
                  "vector-icon-button",
                  rect.min.x.to_bits(),
                  rect.min.y.to_bits(),
                  icon,
              ));
              let response = ui.interact(rect, id, sense);
              paint_vector_icon_button(ui, rect, &response, icon, enabled);
              response.on_hover_text(tooltip)
          }

          fn channel_clickable_row(
              ui: &mut egui::Ui,
              selected: bool,
              solo: bool,
              label: &str,
              accent: egui::Color32,
              height: f32,
          ) -> egui::Response {
              let width = ui.available_width().max(1.0);
              let (rect, response) =
                  ui.allocate_exact_size(egui::vec2(width, height), egui::Sense::click());
              let visuals = ui.visuals();
              let fill = if selected {
                  visuals.selection.bg_fill.gamma_multiply(0.72)
              } else if response.hovered() {
                  visuals.widgets.hovered.bg_fill
              } else {
                  egui::Color32::TRANSPARENT
              };
              if fill != egui::Color32::TRANSPARENT {
                  ui.painter().rect_filled(rect, 4.0, fill);
              }

              let box_rect = egui::Rect::from_center_size(
                  rect.left_center() + egui::vec2(13.0, 0.0),
                  egui::vec2(11.0, 11.0),
              );
              if solo {
                  ui.painter().rect_filled(box_rect, 1.5, accent);
              } else {
                  ui.painter().rect_stroke(
                      box_rect,
                      1.5,
                      egui::Stroke::new(1.4, accent),
                      egui::StrokeKind::Inside,
                  );
              }
              ui.painter().text(
                  rect.left_center() + egui::vec2(29.0, 0.0),
                  egui::Align2::LEFT_CENTER,
                  label,
                  egui::FontId::proportional(14.0),
                  accent,
              );
              response
          }

          fn clickable_row(''',
          'vector icon helpers')

          replace_once(
          '''    let export_clicked = ui
                  .put(
                      export_rect,
                      egui::Button::new("⇧")
                          .frame(false)
                          .sense(egui::Sense::click()),
                  )
                  .on_hover_text("Export this snapshot for the active Face")
                  .clicked()
                  && export_enabled;
              let folder_clicked = if exported {
                  ui.put(
                      check_rect,
                      egui::Button::new("✓")
                          .frame(false)
                          .sense(egui::Sense::click()),
                  )
                  .on_hover_text("Open export folder")
                  .clicked()
              } else {
                  false
              };''',
          '''    let export_clicked = vector_icon_button_at(
                  ui,
                  export_rect,
                  VectorIcon::Export,
                  export_enabled,
                  "Export this snapshot for the active Face",
              )
              .clicked();
              let folder_clicked = if exported {
                  vector_icon_button_at(
                      ui,
                      check_rect,
                      VectorIcon::Check,
                      true,
                      "Open export folder",
                  )
                  .clicked()
              } else {
                  false
              };''',
          'snapshot row vector icons')

          old = '''        let title = if let Some(color) = accent {
                      egui::RichText::new(format!("●  {}", channel_display_name(palette, name, index)))
                          .color(color)
                  } else {
                      egui::RichText::new(channel_display_name(palette, name, index))
                  };'''
          if old in app:
              app = app.replace(old, '''        let title = if let Some(color) = accent {
                      egui::RichText::new(channel_display_name(palette, name, index)).color(color)
                  } else {
                      egui::RichText::new(channel_display_name(palette, name, index))
                  };''', 1)

          app_path.write_text(app, encoding='utf-8')

          cargo = Path('Cargo.toml')
          cargo_text = cargo.read_text(encoding='utf-8')
          if cargo_text.count('version = "0.6.0"') != 1:
              raise SystemExit('Cargo version target not found exactly once')
          cargo.write_text(cargo_text.replace('version = "0.6.0"', 'version = "0.6.1"', 1), encoding='utf-8')

          notes = Path('RELEASE_NOTES.md')
          old_notes = notes.read_text(encoding='utf-8')
          prefix = '''# Shade Editor 0.6.1\n\nFont-independent vector icon compatibility fix.\n\n- Snapshot Export and exported-folder Check actions are now drawn with `egui::Painter` vector geometry instead of Unicode glyphs.\n- Channel Solo indicators are vector outline/filled squares instead of font characters.\n- Read-only palette swatches are vector rectangles.\n- Decorative Unicode check/arrows used by updater/test-code hints were replaced with ASCII text.\n- No icon font or extra Windows font installation is required.\n\n'''
          notes.write_text(prefix + old_notes, encoding='utf-8')
          PY
      - name: Format Rust
        run: cargo fmt
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs Cargo.toml RELEASE_NOTES.md
          git commit -m "Replace Unicode UI icons with vector painter icons"
          git push origin HEAD:fix/vector-icons-no-font
