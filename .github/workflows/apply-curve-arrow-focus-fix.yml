name: Apply and validate curve arrow focus fix

on:
  push:
    branches:
      - fix/curve-arrow-key-focus

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/curve-arrow-key-focus

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply focus-routing fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text(encoding="utf-8")

          old_focus = '''    if graph_response.has_focus() {
                  let (left, right, up, down, shift) = ui.input(|input| {
          '''
          new_focus = '''    if graph_response.has_focus() {
                  ui.memory_mut(|memory| {
                      memory.set_focus_lock_filter(
                          graph_response.id,
                          egui::EventFilter {
                              horizontal_arrows: true,
                              vertical_arrows: true,
                              ..Default::default()
                          },
                      );
                  });
                  let (left, right, up, down, shift) = ui.input(|input| {
          '''

          old_nudge = '''        if left || right || up || down {
                      let units = if shift { 10 } else { 1 };
          '''
          new_nudge = '''        if left || right || up || down {
                      // Focus navigation is decided at the start of the frame, before this
                      // custom graph sees the key event. Cancel that pending movement so the
                      // first arrow press after selecting a point cannot escape the graph.
                      ui.memory_mut(|memory| memory.move_focus(egui::FocusDirection::None));
                      let units = if shift { 10 } else { 1 };
          '''

          if old_focus not in text:
              raise SystemExit("curve focus block not found")
          if old_nudge not in text:
              raise SystemExit("curve nudge block not found")

          text = text.replace(old_focus, new_focus, 1)
          text = text.replace(old_nudge, new_nudge, 1)
          path.write_text(text, encoding="utf-8")
          '@ | Set-Content -Path apply_fix.py -Encoding utf8
          python apply_fix.py
          Remove-Item apply_fix.py
          cargo fmt

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Commit validated fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-curve-arrow-focus-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs .github/workflows/apply-curve-arrow-focus-fix.yml
          git diff --cached --check
          git commit -m "fix(curves): keep arrow-key focus on selected point (#32)"
          git push origin HEAD:fix/curve-arrow-key-focus
