name: Apply Shade Editor v0.4.2 source patch

on:
  push:
    branches:
      - feat/channel-solo-toggle-mixer-spacing

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v042-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_v042.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml RELEASE_NOTES.md src/app_main.rs
          git commit -m "Apply channel solo toggle and mixer spacing [v042-applied]"
          git push origin HEAD:feat/channel-solo-toggle-mixer-spacing
