name: Fix Shade Editor v0.10.3 local module paths

on:
  push:
    branches: [feat/v0103-production-workflow]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0103-production-workflow
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shade-editor-windows
      - name: Replace generated module paths
        shell: pwsh
        run: |
          $path = "src/app_main.rs"
          $app = [IO.File]::ReadAllText($path)
          $app = [regex]::Replace($app, '#\[path = "[^"]*settings_v0103\.rs"\]', '#[path = "settings_v6.rs"]')
          $app = [regex]::Replace($app, '#\[path = "[^"]*validation_v0103\.rs"\]', '#[path = "validation.rs"]')
          [IO.File]::WriteAllText($path, $app, [Text.UTF8Encoding]::new($false))
          cargo fmt --all
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Commit corrected source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs
          git rm .github/workflows/fix-v0103-local-module-paths.yml
          git commit -m "Fix v0.10.3 local module paths"
          git push origin HEAD:feat/v0103-production-workflow
