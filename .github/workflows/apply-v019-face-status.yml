name: Apply v0.19 Face status

on:
  push:
    branches:
      - feature/v019-face-status

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation
        run: python .github/scripts/apply_v019_face_status.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v0.19): add Accepted and Rejected Face workflow (#37)"
          git push
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v019-face-status-windows-x64
          path: target/release/ShadeEditor.exe
          if-no-files-found: error
