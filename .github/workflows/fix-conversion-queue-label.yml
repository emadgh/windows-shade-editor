name: Preserve conversion queue UI contract

on:
  push:
    branches:
      - codex/compact-color-conversion-window

permissions:
  contents: write

jobs:
  fix-label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/compact-color-conversion-window
          fetch-depth: 0
      - name: Preserve canonical queue label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui/color_conversion.rs')
          s = p.read_text(encoding='utf-8')
          old = 'egui::CollapsingHeader::new(format!("Conversion queue ({})", queue_rows.len()))'
          new = 'egui::CollapsingHeader::new(format!("Conversion Queue ({})", queue_rows.len()))'
          if s.count(old) != 1:
              raise SystemExit(f'expected one queue foldout label, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-conversion-queue-label.yml
          git add src/ui/color_conversion.rs
          git commit -m "Preserve conversion queue UI contract"
          git push origin HEAD:codex/compact-color-conversion-window
