name: Fix Shade Editor v0.8.0 Curve constraints

on:
  push:
    branches: [feat/optional-midpoint-project-metadata]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/optional-midpoint-project-metadata
          fetch-depth: 0
      - name: Apply fix
        shell: bash
        run: |
          python scripts/fix_v080.py
          cargo fmt --all
          if ! git diff --quiet -- src/app_main.rs src/model_v6.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app_main.rs src/model_v6.rs
            git commit -m "Fix optional midpoint endpoint constraints"
            git push origin HEAD:feat/optional-midpoint-project-metadata
          else
            echo "v0.8.0 Curve constraints already fixed"
          fi
