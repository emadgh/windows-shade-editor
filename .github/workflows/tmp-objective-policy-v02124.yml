name: Temporary guarded v0.21.24 generation
on:
  push:
    branches:
      - tmp/objective-policy-v02124-bump
permissions:
  contents: write
jobs:
  bump:
    if: github.event.head_commit.message != 'chore(version): prepare v0.21.24'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp/objective-policy-v02124-bump
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Generate version identity through Cargo
        shell: pwsh
        run: |
          $cargoPath = 'Cargo.toml'
          $text = Get-Content -Raw $cargoPath
          $old = 'version = "0.21.23"'
          $new = 'version = "0.21.24"'
          $oldCount = ([regex]::Matches($text, [regex]::Escape($old))).Count
          $newCount = ([regex]::Matches($text, [regex]::Escape($new))).Count
          if ($oldCount -eq 1 -and $newCount -eq 0) {
            $text = $text.Replace($old, $new)
            [System.IO.File]::WriteAllText((Resolve-Path $cargoPath), $text, [System.Text.UTF8Encoding]::new($false))
          } elseif (-not ($oldCount -eq 0 -and $newCount -eq 1)) {
            throw "Unexpected Cargo.toml root version markers: old=$oldCount new=$newCount"
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'VERSION'), "0.21.24`n", [System.Text.UTF8Encoding]::new($false))
          cargo update -p windows-shade-editor --precise 0.21.24
      - name: Guard exact version-only drift
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $expected = @('Cargo.lock','Cargo.toml','VERSION')
          if ((Compare-Object ($changed | Sort-Object) ($expected | Sort-Object))) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          $script = @'
          from pathlib import Path
          lock = Path('Cargo.lock').read_text(encoding='utf-8')
          marker = 'name = "windows-shade-editor"\nversion = "0.21.24"'
          if marker not in lock:
              raise SystemExit('root package version was not regenerated to 0.21.24')
          '@
          $script | python -
          git diff --check
          cargo check --locked --target x86_64-pc-windows-msvc
      - name: Commit exact generated files
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock VERSION
          git commit -m 'chore(version): prepare v0.21.24'
          git push origin HEAD:tmp/objective-policy-v02124-bump
