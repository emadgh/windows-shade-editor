name: Apply Shade Editor v0.10.1 validator integration

on:
  push:
    branches: [feat/v0101-roundtrip-validator]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0101-roundtrip-validator
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shade-editor-windows
      - name: Apply and validate v0.10.1
        shell: pwsh
        run: |
          python scripts/apply_v0101_validation.py
          cargo fmt --all
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc
      - name: Commit validated source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml README.md RELEASE_NOTES.md src/app_main.rs src/validation.rs
          git rm scripts/apply_v0101_validation.py
          git commit -m "Add production TIFF round-trip validator"
          git push origin HEAD:feat/v0101-roundtrip-validator
