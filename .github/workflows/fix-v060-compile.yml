name: Fix Shade Editor v0.6.0 compile issue

on:
  push:
    branches:
      - feat/default-dpi-channel-palettes
    paths:
      - .github/workflows/fix-v060-compile.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/default-dpi-channel-palettes
          fetch-depth: 0
      - name: Fix extra reference in palette label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app_main.rs')
          s = p.read_text(encoding='utf-8')
          old = '                &output_display,\n'
          new = '                output_display,\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected 1 target, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: cargo fmt
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs
          git commit -m "Fix palette selectable label type [v060-compile-fix]"
          git push origin HEAD:feat/default-dpi-channel-palettes
