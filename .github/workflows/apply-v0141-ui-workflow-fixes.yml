name: Apply v0.14.1 UI workflow fixes

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.event.head_commit.message == 'Run v0.14.1 UI migration'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply source migration
        run: python scripts/apply_v0141_ui_workflow_fixes.py
      - name: Apply egui 0.35 Panel API fix
        run: python scripts/fix_v0141_egui_panel_api.py
      - name: Format
        run: cargo fmt --all
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path Cargo.toml -Pattern 'version = "0.14.1"' | Out-Null
          Select-String -Path src/app_main.rs -Pattern 'Window::new\("Project View"\)' | Out-Null
          Select-String -Path src/app_main.rs -Pattern 'Panel::right\("project-view-preview-pane"\)' | Out-Null
          Select-String -Path src/app_main.rs -Pattern 'size_range\(320.0\.\.=580.0\)' | Out-Null
          Select-String -Path src/app_main.rs -Pattern 'desired_width\(380.0\)' | Out-Null
          Select-String -Path src/workflow_v0103.rs -Pattern 'Key::E' | Out-Null
      - name: Check locked Windows build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs src/workflow_v0103.rs src/previous_shades.rs Cargo.toml Cargo.lock README.md RELEASE_NOTES.md
          git commit -m "Fix Project View and editor workflow UI"
          git push
