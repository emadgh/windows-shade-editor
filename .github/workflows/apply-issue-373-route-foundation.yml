name: Apply Issue 373 Route Foundation

on:
  push:
    branches:
      - codex/issue-373-conversion-routes

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue-373-route-foundation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-373-conversion-routes
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply route foundation
        run: python scripts/issue373_route_foundation.py
      - name: Verify diff
        run: git diff --check
      - name: Remove temporary patch scaffolding
        run: git rm .github/workflows/apply-issue-373-route-foundation.yml scripts/issue373_route_foundation.py
      - name: Commit route foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist Source conversion route mirrors [issue-373-route-foundation]"
          git push origin HEAD:codex/issue-373-conversion-routes
