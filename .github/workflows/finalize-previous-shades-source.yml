name: Finalize Previous Shades source

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Previous Shades source formatting'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Format milestone source
        shell: pwsh
        run: |
          rustfmt --edition 2024 src/app_main.rs src/previous_shades.rs
      - name: Sync Cargo lockfile
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('Cargo.lock')
          text = path.read_text(encoding='utf-8')
          old = 'name = "windows-shade-editor"\nversion = "0.12.1"'
          new = 'name = "windows-shade-editor"\nversion = "0.13.0"'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one package-version match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -
      - name: Check locked build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Commit final source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs src/previous_shades.rs Cargo.lock
          git commit -m "Format Previous Shades source and sync lockfile"
          git push origin HEAD:main
