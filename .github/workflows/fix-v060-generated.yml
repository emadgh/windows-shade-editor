name: Fix Shade Editor v0.6.0 generated source

on:
  push:
    branches:
      - feat/default-dpi-channel-palettes
    paths:
      - tools/fix_v060_generated.py
      - .github/workflows/fix-v060-generated.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/default-dpi-channel-palettes
          fetch-depth: 0
      - name: Apply generated-source fix
        run: python tools/fix_v060_generated.py
      - name: Format Rust
        run: cargo fmt
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs
          git commit -m "Fix stacked palette wiring [v060-generated-fix]" || exit 0
          git push origin HEAD:feat/default-dpi-channel-palettes
