name: Validate Phase 5 Production Conformance

permissions:
  contents: write

on:
  push:
    branches:
      - hardening/v0.18

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Check Windows target
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test Windows target
        id: phase5_test
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath phase5-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Phase 5 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-test-log
          path: phase5-test.log
      - name: Fail on test errors
        if: steps.phase5_test.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - name: Remove temporary Phase 5 workflow
        shell: pwsh
        run: git rm .github/workflows/phase5-hardening.yml
      - name: Commit validated Phase 5 source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Phase 5: add production conformance and acceptance guards"
          git push origin HEAD:hardening/v0.18
