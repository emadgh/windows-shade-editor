'''
          if text.count(old) != 1:
              raise SystemExit(f'queue legacy test marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        assert_eq!(
            queue.items[0].spec.production_project_disposition,
            disposition
        );
'''
          new = '''        assert_eq!(
            queue.items[0].spec.capture.production_project_disposition,
            disposition
        );
'''
          if text.count(old) != 1:
              raise SystemExit(f'queue append assertion marker count={text.count(old)}')
          queue.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # 3) Explicit transaction parameter may not override immutable capture intent.
          td = Path('src/conversion_transaction_disposition.rs')
          text = td.read_text(encoding='utf-8')
          marker = '''    if let Err(error) = disposition.validate() {
        return ConversionTransactionOutcome::FailedBeforeCommit {
            phase: ConversionPhase::CaptureValidation,
            error,
        };
    }

'''
          replacement = marker + '''    if &capture.production_project_disposition != disposition {
        return ConversionTransactionOutcome::FailedBeforeCommit {
            phase: ConversionPhase::CaptureValidation,
