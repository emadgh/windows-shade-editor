                .to_owned(),
        };
    }

'''
          if text.count(marker) != 1:
              raise SystemExit(f'transaction disposition validation marker count={text.count(marker)}')
          text = text.replace(marker, replacement, 1)
          old = '''            &capture(),
            &disposition,
'''
          count = text.count(old)
          if count < 4:
              raise SystemExit(f'append transaction test call count={count}')
          new = '''            &capture()
                .with_production_project_disposition(disposition.clone())
                .unwrap(),
            &disposition,
'''
          text = text.replace(old, new)
          td.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            cargo fmt --all
          }
          cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $allowed = @(
            'src/conversion_transaction.rs',
            'src/conversion_capture_compat_tests.rs',
            'src/conversion_queue.rs',
            'src/conversion_transaction_disposition.rs',
            'src/icc_conversion_worker.rs',
            'src/ui/color_conversion.rs',
            'src/main.rs',
            'tests/non_tiff_production_source.rs'
          )
          $changed = @(git diff --name-only)
          foreach ($file in $changed) {
            if ($allowed -notcontains $file) { throw "Unexpected capture-owned migration file $file" }
          }

          git config user.name 'github-actions[bot]'
