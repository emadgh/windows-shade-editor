name: Fix compact color conversion layout

on:
  push:
    branches:
      - codex/compact-color-conversion-window

permissions:
  contents: write

jobs:
  fix-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/compact-color-conversion-window
          fetch-depth: 0

      - name: Fix egui compatibility and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/color_conversion.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        let scroll_height = (ctx.available_rect().height() - 120.0).clamp(360.0, 720.0);',
                  '        // Keep the content region bounded so the outer conversion UI always scrolls.\n        // A fixed cap avoids depending on viewport APIs that vary across egui releases.\n        let scroll_height = 620.0;',
              ),
              (
                  '    #[test]\n    #[test]\n    fn conversion_window_layout_stays_scrollable_and_foldable()',
                  '    #[test]\n    fn conversion_window_layout_stays_scrollable_and_foldable()',
              ),
              (
                  '    }\n\n    fn production_execution_support_matrix_keeps_non_rgb_non_tiff_fail_closed()',
                  '    }\n\n    #[test]\n    fn production_execution_support_matrix_keeps_non_rgb_non_tiff_fail_closed()',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement for {old[:70]!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-compact-color-conversion-layout.yml
          git add src/ui/color_conversion.rs
          git commit -m "Fix compact conversion window compatibility"
          git push origin HEAD:codex/compact-color-conversion-window
