name: Validate v0.18.1 Operator Feedback

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v0181-queue-templates-ui

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Fix patcher compatibility
        run: python tools/fix_v0181_patcher.py
      - name: Apply operator feedback patch
        run: python tools/apply_v0181_feedback.py
      - name: Refresh lockfile for v0.18.1
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Format
        run: cargo fmt --all
      - name: Check Windows target locked
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test Windows target locked
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build Windows release locked
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify patch invariants
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne '0.18.1') { throw 'VERSION mismatch' }
          if (-not (Select-String -Quiet -Path Cargo.toml -Pattern 'version = "0.18.1"')) { throw 'Cargo.toml version mismatch' }
          if (-not (Select-String -Quiet -Path Cargo.lock -Pattern 'version = "0.18.1"')) { throw 'Cargo.lock version mismatch' }
          if (-not (Select-String -Quiet -Path src/export.rs -Pattern 'spool\.tmp')) { throw 'short spool path missing' }
          if (Select-String -Quiet -Path src/export.rs -Pattern 'shade-editor-spool') { throw 'legacy long spool naming still present' }
          if (-not (Select-String -Quiet -Path src/export_queue.rs -Pattern 'requires_resume')) { throw 'recovered queue resume gate missing' }
          if (-not (Select-String -Quiet -Path src/settings.rs -Pattern 'snapshot_export_template')) { throw 'snapshot/test export template missing' }
      - name: Remove temporary patch infrastructure
        shell: pwsh
        run: |
          git rm .github/workflows/apply-v0181-feedback.yml
          git rm tools/apply_v0181_feedback.py
          git rm tools/fix_v0181_patcher.py
      - name: Commit validated v0.18.1 source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Shade Editor v0.18.1 operator workflow fixes"
          git push origin HEAD:fix/v0181-queue-templates-ui
