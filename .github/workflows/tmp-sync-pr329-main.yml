name: Temporary cleanup PR329 sync workflow

on:
  push:
    branches:
      - codex/color-conversion-production-destination-ui
    paths:
      - .github/workflows/tmp-sync-pr329-main.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/color-conversion-production-destination-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-sync-pr329-main.yml
          git commit -m "ci: remove temporary PR329 sync workflow"
          git push origin HEAD:codex/color-conversion-production-destination-ui
