name: Temporary sync PR329 with v0.21.49 main

on:
  push:
    branches:
      - codex/color-conversion-production-destination-ui
    paths:
      - .github/workflows/tmp-sync-pr329-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/color-conversion-production-destination-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main and restore combined Color Conversion UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already merged; nothing to do"
            exit 0
          fi
          git merge --no-edit -X ours origin/main
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('src/lib.rs')
          text = lib.read_text()
          marker = 'pub mod conversion_recipe;\n'
          if 'pub mod conversion_recovery;' not in text:
              if marker not in text:
                  raise SystemExit('lib.rs conversion_recipe marker missing')
              text = text.replace(marker, marker + 'pub mod conversion_recovery;\n', 1)
          lib.write_text(text)

          ui = Path('src/ui/color_conversion.rs')
          text = ui.read_text()

          enum_old = '''    Cancel(u64),\n    Retry(u64),\n    ClearFinished,\n'''
          enum_new = '''    Cancel(u64),\n    Retry(u64),\n    RecoverProject(u64),\n    ClearFinished,\n'''
          if 'RecoverProject(u64)' not in text:
              if enum_old not in text:
                  raise SystemExit('queue action enum marker missing')
              text = text.replace(enum_old, enum_new, 1)

          handler_old = '''                ConversionQueueUiAction::Retry(id) => {\n                    self.conversion_queue.retry(id);\n                }\n                ConversionQueueUiAction::ClearFinished => {\n'''
          handler_new = '''                ConversionQueueUiAction::Retry(id) => {\n                    self.conversion_queue.retry(id);\n                }\n                ConversionQueueUiAction::RecoverProject(id) => {\n                    match self.conversion_queue.recover_project(id) {\n                        Ok(Some(completion)) => {\n                            let is_current_source =\n                                self.project_path.as_ref().is_some_and(|path| {\n                                    path.to_string_lossy().eq_ignore_ascii_case(\n                                        &completion.capture.source_project_path.to_string_lossy(),\n                                    )\n                                });\n                            match completion.result {\n                                windows_shade_editor::conversion_queue::ConversionQueueCompletionResult::Completed(completed) => {\n                                    if is_current_source {\n                                        match production_project::link_source_project_to_production(\n                                            &mut self.project,\n                                            &completed.production_project_path,\n                                        ) {\n                                            Ok(()) => {\n                                                self.mark_project_dirty();\n                                                self.log.info(\n                                                    "Recovered Production linkage changed the open Source project; explicit Save is required.",\n                                                );\n                                            }\n                                            Err(error) => self.log.error(&format!(\n                                                "Could not mirror recovered Production link in the open Source project: {error}"\n                                            )),\n                                        }\n                                    }\n                                    self.report_info(format!(\n                                        "Recovered Production project: {}",\n                                        completed.production_project_path.display()\n                                    ));\n                                }\n                                _ => self.report_error(\n                                    "Project-only recovery returned an unexpected conversion result.",\n                                ),\n                            }\n                        }\n                        Ok(None) => self\n                            .report_info("This conversion item has no project-only recovery work."),\n                        Err(error) => self\n                            .report_error(format!("Production project recovery blocked: {error}")),\n                    }\n                }\n                ConversionQueueUiAction::ClearFinished => {\n'''
          if 'ConversionQueueUiAction::RecoverProject(id) =>' not in text:
              if handler_old not in text:
                  raise SystemExit('queue action handler marker missing')
              text = text.replace(handler_old, handler_new, 1)

          queue_old = '''                ConversionQueueStatus::Failed\n                | ConversionQueueStatus::Cancelled\n                | ConversionQueueStatus::NeedsRecovery => {\n                    if ui.button("Retry safely").clicked() {\n                        actions.push(ConversionQueueUiAction::Retry(row.id));\n                    }\n                }\n                ConversionQueueStatus::Done => {}\n'''
          queue_new = '''                ConversionQueueStatus::Failed | ConversionQueueStatus::Cancelled => {\n                    if ui.button("Retry safely").clicked() {\n                        actions.push(ConversionQueueUiAction::Retry(row.id));\n                    }\n                }\n                ConversionQueueStatus::NeedsRecovery => {\n                    if ui\n                        .button("Recover Project")\n                        .on_hover_text(\n                            "Complete only the Production .shade save. The committed TIFF is verified and never rendered again.",\n                        )\n                        .clicked()\n                    {\n                        actions.push(ConversionQueueUiAction::RecoverProject(row.id));\n                    }\n                }\n                ConversionQueueStatus::Done => {}\n'''
          if 'actions.push(ConversionQueueUiAction::RecoverProject(row.id));' not in text:
              if queue_old not in text:
                  raise SystemExit('queue rendering marker missing')
              text = text.replace(queue_old, queue_new, 1)

          ui.write_text(text)
          PY
          git add src/lib.rs src/ui/color_conversion.rs
          if ! git diff --cached --quiet; then
            git commit -m "merge: sync v0.21.49 recovery into Production destination UI"
          fi
          git push origin HEAD:codex/color-conversion-production-destination-ui
