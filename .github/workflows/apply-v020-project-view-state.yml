name: Validate Project View state v0.20.1

on:
  push:
    branches:
      - refactor/v020-project-view-state

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Project View state extraction
        run: python .github/scripts/apply_v020_project_view_state.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check Release graph
        run: cargo check --release --locked
      - name: Full Release tests
        run: cargo test --release --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Validate version and state architecture
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          $version = (Get-Content VERSION -Raw).Trim()
          if ($cargo -ne '0.20.1' -or $version -ne '0.20.1') { throw "Version mismatch: Cargo=$cargo VERSION=$version" }
          if (-not (Select-String -Path src/ui/project_view_state.rs -Pattern 'struct ProjectViewState' -Quiet)) { throw 'ProjectViewState missing' }
          $main = Get-Content src/main.rs -Raw
          if ($main -notmatch 'project_view: ui::project_view_state::ProjectViewState') { throw 'Focused Project View state is not owned by ShadeApp' }
          foreach ($legacy in @('show_previous_shades: bool','previous_shades_query: String','previous_shades_selected: Option<String>','previous_shade_preview_error: Option<String>')) {
            if ($main.Contains($legacy)) { throw "Legacy Project View field remains: $legacy" }
          }
      - name: Commit validated Project View state extraction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(project-view): extract transient UI state (#51)"
          git push
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v0.20.1-windows-x64
          path: target/release/ShadeEditor.exe
          if-no-files-found: error
