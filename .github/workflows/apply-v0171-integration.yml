name: Validate v0.17.1 integration

permissions:
  contents: write

on:
  push:
    branches:
      - fix/v0171-integrate-production-tools-middle-preview

jobs:
  integrate-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Apply v0.17.1 integration
        run: python tools/apply_v0171_integration.py

      - name: Format
        run: cargo fmt --all

      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Test Windows target
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Windows release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = "target/x86_64-pc-windows-msvc/release/ShadeEditor.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Copy-Item $exe artifact/ShadeEditor.exe
          "$hash  ShadeEditor.exe" | Set-Content -Encoding ascii -NoNewline artifact/ShadeEditor.exe.sha256
          Copy-Item README.md artifact/README.md
          Copy-Item RELEASE_NOTES.md artifact/RELEASE_NOTES.md
          Copy-Item LICENSE artifact/LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v0.17.1-validation-win-x64
          path: artifact
          if-no-files-found: error

      - name: Remove temporary migration infrastructure
        shell: pwsh
        run: |
          git rm tools/apply_v0171_integration.py
          git rm .github/workflows/apply-v0171-integration.yml

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Integrate production tools and embedded source preview"
          git push origin HEAD:fix/v0171-integrate-production-tools-middle-preview
