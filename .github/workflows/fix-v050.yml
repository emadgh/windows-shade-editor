name: Fix Shade Editor v0.5.0 generated UI

on:
  push:
    branches:
      - feat/snapshot-export-curve-workflow
    paths:
      - tools/fix_v050.py
      - .github/workflows/fix-v050.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[v050-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/snapshot-export-curve-workflow
      - run: python tools/fix_v050.py
      - run: cargo fmt
      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_main.rs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix v0.5.0 adjustment wiring and compact export UI [v050-fix-applied]"
            git push origin HEAD:feat/snapshot-export-curve-workflow
          fi
