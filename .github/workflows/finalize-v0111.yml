name: Finalize Shade Editor v0.11.1

on:
  push:
    branches: [test/v0111-tiff-conformance]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/v0111-tiff-conformance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Refresh lockfile and release notes
        shell: pwsh
        run: |
          cargo check --target x86_64-pc-windows-msvc
          $path = 'RELEASE_NOTES.md'
          $text = Get-Content -Raw $path
          if (-not $text.StartsWith('# Shade Editor v0.11.1')) {
            $notes = @'
          # Shade Editor v0.11.1

          - Fixes physical TIFF DPI detection: XResolution/YResolution are TIFF RATIONAL values and are now decoded as numerator/denominator instead of incorrectly requesting DOUBLE tags.
          - Honors TIFF 6.0's default ResolutionUnit of inches when tag 296 is omitted.
          - Adds a TIFF export conformance matrix covering Uncompressed, LZW, PackBits, Deflate, horizontal Predictor, 16-bit CMYK, CMYK + Spot ExtraSamples, ICC, Photoshop resources 34377/37724, and physical DPI.
          - `.shade` schema remains v9.

          '@
            Set-Content -NoNewline -Encoding utf8 $path ($notes + $text)
          }
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Commit finalized metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock RELEASE_NOTES.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Finalize Shade Editor v0.11.1 metadata"
            git push origin HEAD:test/v0111-tiff-conformance
          }
