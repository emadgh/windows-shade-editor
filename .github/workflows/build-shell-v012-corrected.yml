name: Validate Shade Editor Shell v0.12

on:
  push:
    branches: [feat/v012-windows-shell-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and test native handler
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist shell\bin mkdir shell\bin
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeProjectDataTests.exe shell\ShadeProjectDataTests.cpp shell\ShadeProjectData.cpp
          if errorlevel 1 exit /b 1
          shell\bin\ShadeProjectDataTests.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DUNICODE /D_UNICODE /LD /Fe:shell\bin\ShadeEditorShell.dll shell\ShadeEditorShellV012.cpp shell\ShadeProjectData.cpp /link ole32.lib shlwapi.lib windowscodecs.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeShellTests.exe shell\ShadeShellTests.cpp /link ole32.lib shlwapi.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          shell\bin\ShadeShellTests.exe shell\bin\ShadeEditorShell.dll
          if errorlevel 1 exit /b 1
      - name: Validate property schema XML
        shell: pwsh
        run: |
          [xml](Get-Content -Raw shell/ShadeEditor.propdesc) | Out-Null
      - name: Package shell test artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shell-artifact | Out-Null
          Copy-Item shell/bin/ShadeEditorShell.dll shell-artifact/ShadeEditorShell.dll
          Copy-Item shell/ShadeEditor.propdesc shell-artifact/ShadeEditor.propdesc
          $hash = (Get-FileHash -Algorithm SHA256 shell/bin/ShadeEditorShell.dll).Hash.ToLowerInvariant()
          "$hash  ShadeEditorShell.dll" | Set-Content -Encoding ascii -NoNewline shell-artifact/ShadeEditorShell.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ShadeEditorShell-corrected-win-x64
          path: shell-artifact
