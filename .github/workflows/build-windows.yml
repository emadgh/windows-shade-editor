name: Diagnostic PR192 holdout tests

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  holdout-determinism:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Determinism and non-grid invariant
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_holdout::tests::v1_holdouts_are_deterministic_and_exclude_grid_nodes -- --nocapture

  holdout-small-grid-union:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Small grid uniqueness invariant
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_holdout::tests::full_small_grid_uses_every_non_path_cell_center_once -- --nocapture

  holdout-large-grid-bound:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Large grid work bound invariant
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_holdout::tests::large_grid_cell_population_is_bounded -- --nocapture

  holdout-path-order:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Path identity and order invariant
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_holdout::tests::path_identity_and_order_are_stable -- --nocapture
