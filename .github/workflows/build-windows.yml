name: Diagnostic PR192 tests

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  lib-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Compile library tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib --no-run

  bin-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Compile binary tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin ShadeEditor --no-run

  validation-contract-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run validation contract tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_validation_tests -- --nocapture

  holdout-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run holdout generator tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_holdout::tests -- --nocapture

  validation-evaluator-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run validation evaluator tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib inverse_lut_validation_eval::tests -- --nocapture

  full-library-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run all library tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib

  full-binary-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run all binary tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin ShadeEditor
