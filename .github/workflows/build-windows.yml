name: Build Shade Editor for Windows

permissions:
  contents: write

on:
  pull_request:

jobs:
  sync-version-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Generate synchronized Cargo.lock
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Persist synchronized Cargo.lock
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git diff --quiet -- Cargo.lock
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo.lock is already synchronized."
            exit 0
          }

          $generatedLock = Join-Path $env:RUNNER_TEMP "Cargo.lock.generated"
          Copy-Item Cargo.lock $generatedLock

          git fetch origin $env:HEAD_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch PR head branch." }
          git checkout -B $env:HEAD_BRANCH "origin/$env:HEAD_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Cannot checkout PR head branch." }

          Copy-Item $generatedLock Cargo.lock -Force
          git add Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Generated Cargo.lock matches the PR branch."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(version): sync Cargo.lock to 0.21.1"
          if ($LASTEXITCODE -ne 0) { throw "Cannot commit synchronized Cargo.lock." }
          git push origin "HEAD:$env:HEAD_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Cannot push synchronized Cargo.lock." }
