name: Build Shade Editor for Windows

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: shade-editor-windows
      - name: Check
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = "target/x86_64-pc-windows-msvc/release/ShadeEditor.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  ShadeEditor.exe" | Set-Content -Encoding ascii -NoNewline "target/x86_64-pc-windows-msvc/release/ShadeEditor.exe.sha256"
          Copy-Item $exe artifact/ShadeEditor.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/ShadeEditor.exe.sha256 artifact/ShadeEditor.exe.sha256
          Copy-Item README.md artifact/README.md
          Copy-Item LICENSE artifact/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-win-x64
          path: artifact
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            target/x86_64-pc-windows-msvc/release/ShadeEditor.exe `
            target/x86_64-pc-windows-msvc/release/ShadeEditor.exe.sha256 `
            --title "Shade Editor ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md `
            --latest
