name: Validate Phase 4 Architecture Refactor

permissions:
  contents: write

on:
  push:
    branches:
      - hardening/v0.18

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply Phase 4 migration
        run: python tools/apply_phase4_refactor.py
      - name: Apply remaining controller routing fix
        run: python tools/phase4_compile_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Test Windows target
        id: phase4_test
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath phase4-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Phase 4 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-test-log
          path: phase4-test.log
      - name: Fail on test errors
        if: steps.phase4_test.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - name: Remove temporary Phase 4 infrastructure
        shell: pwsh
        run: |
          git rm tools/apply_phase4_refactor.py
          git rm tools/phase4_compile_fix.py
          git rm .github/workflows/phase4-hardening.yml
      - name: Commit validated Phase 4 source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Phase 4: extract controllers and add integration wiring tests"
          git push origin HEAD:hardening/v0.18
