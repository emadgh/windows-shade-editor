name: Fix Shade Editor v0.7.1 id salt bound

on:
  push:
    branches:
      - feat/compact-adjustment-resets

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/compact-adjustment-resets
          fetch-depth: 0
      - name: Apply fix
        run: python scripts/fix_v071_id_salt.py
      - name: Format
        run: cargo fmt --all
      - name: Commit
        shell: bash
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/app_main.rs
          git commit -m "Fix egui persistent id salt bound"
          git push origin HEAD:feat/compact-adjustment-resets
