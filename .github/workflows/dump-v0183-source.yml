name: Dump v0.18.3 source

on:
  push:
    branches:
      - feature/v0183-master-adjustments

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: v0183-source
          path: |
            src/main.rs
            src/model.rs
            src/render.rs
            src/export.rs
            src/export_recipe.rs
            src/history.rs
            src/workflow.rs
            src/lib.rs
            Cargo.toml
            Cargo.lock
            VERSION
            RELEASE_NOTES.md
          retention-days: 1
