name: Finalize Levels and Mixer UI

permissions:
  contents: write

on:
  push:
    branches:
      - feat/levels-ui-mixer-percent

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/levels-ui-mixer-percent
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Reapply validated Issue 61 production patch
        shell: pwsh
        run: |
          $text = Get-Content -Raw .github/workflows/validate-issue61-v2.yml
          $start = "          python - <<'PY'`n"
          $end = "`n          PY"
          $parts = $text.Split($start, 2)
          if ($parts.Count -ne 2) { throw 'Could not locate Issue 61 patch script start' }
          $block = $parts[1].Split($end, 2)[0]
          $lines = $block -split "`r?`n"
          $clean = foreach ($line in $lines) {
            if ($line.StartsWith('          ')) { $line.Substring(10) } else { $line }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'apply_issue61.py'), ($clean -join "`n"), [Text.UTF8Encoding]::new($false))
          python apply_issue61.py
          Remove-Item apply_issue61.py

      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --release --locked --target x86_64-pc-windows-msvc
      - name: Full Release tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc
      - name: Release build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build and test native Shell extension
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist shell\bin mkdir shell\bin
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeProjectDataTests.exe shell\ShadeProjectDataTests.cpp shell\ShadeProjectData.cpp
          if errorlevel 1 exit /b 1
          shell\bin\ShadeProjectDataTests.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /LD /Fe:shell\bin\ShadeEditorShell.dll shell\ShadeEditorShell.cpp shell\ShadeProjectData.cpp /link ole32.lib shlwapi.lib windowscodecs.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeShellTests.exe shell\ShadeShellTests.cpp /link ole32.lib shlwapi.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          shell\bin\ShadeShellTests.exe shell\bin\ShadeEditorShell.dll
          if errorlevel 1 exit /b 1

      - name: Validate Shell property schema XML
        shell: pwsh
        run: '[xml](Get-Content -Raw shell/ShadeEditor.propdesc) | Out-Null'

      - name: Validate Issue 61 production invariants
        shell: pwsh
        run: |
          if ((Get-Content -Raw VERSION).Trim() -ne '0.20.4') { throw 'VERSION mismatch' }
          $cargo = Get-Content -Raw Cargo.toml
          if ($cargo -notmatch 'version\s*=\s*"0\.20\.4"') { throw 'Cargo.toml version mismatch' }
          $lock = Get-Content -Raw Cargo.lock
          if ($lock -notmatch 'name\s*=\s*"windows-shade-editor"[\s\S]*?version\s*=\s*"0\.20\.4"') { throw 'Cargo.lock version mismatch' }
          if (-not (Test-Path src/ui/levels_mixer.rs)) { throw 'Levels/Mixer module missing' }
          $ui = Get-Content -Raw src/ui/levels_mixer.rs
          foreach ($needle in @('Before','After','tonal_display_value','step_by(1.0)','suffix("%")','Input Levels','Output Levels','0–255 sample scale')) {
            if (-not $ui.Contains($needle)) { throw "Missing Levels/Mixer invariant: $needle" }
          }
          $main = Get-Content -Raw src/main.rs
          if ($main.Contains("`nfn levels_ui(")) { throw 'Legacy Levels helper remains in main.rs' }
          if ($main.Contains("`nfn mixer_ui(")) { throw 'Legacy Mixer helper remains in main.rs' }
          $adjustments = Get-Content -Raw src/ui/adjustments.rs
          if (-not $adjustments.Contains('histogram_before')) { throw 'Levels before histogram wiring missing' }
          if (-not $adjustments.Contains('histogram_after')) { throw 'Levels after histogram wiring missing' }

      - name: Commit validated production tree and remove temporary workflows
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-issue61.yml .github/workflows/validate-issue61-v2.yml .github/workflows/validate-issue61-final.yml
          git add src/ui/levels_mixer.rs src/ui/mod.rs src/ui/adjustments.rs src/main.rs Cargo.toml Cargo.lock VERSION RELEASE_NOTES.md
          git diff --cached --check
          git commit -m 'feat(ui): redesign Levels and use percent Mixer controls (#61)'
          git push origin HEAD:feat/levels-ui-mixer-percent

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = 'target/x86_64-pc-windows-msvc/release/ShadeEditor.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  ShadeEditor.exe" | Set-Content -Encoding ascii -NoNewline 'artifact/ShadeEditor.exe.sha256'
          Copy-Item $exe artifact/ShadeEditor.exe
          Copy-Item README.md artifact/README.md
          Copy-Item LICENSE artifact/LICENSE
          New-Item -ItemType Directory -Force artifact/Shell | Out-Null
          Copy-Item shell/bin/ShadeEditorShell.dll artifact/Shell/ShadeEditorShell.dll
          Copy-Item shell/ShadeEditor.propdesc artifact/Shell/ShadeEditor.propdesc
          Copy-Item shell/Install-ShadeEditorShell.ps1 artifact/Shell/Install-ShadeEditorShell.ps1
          Copy-Item shell/Uninstall-ShadeEditorShell.ps1 artifact/Shell/Uninstall-ShadeEditorShell.ps1
          Copy-Item shell/README.md artifact/Shell/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v0.20.4-win-x64
          path: artifact
