name: Apply Issue 372 Patch

on:
  push:
    branches:
      - codex/issue-372-unified-color-conversion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue-372-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-372-unified-color-conversion
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply focused source patch
        run: python scripts/issue372_patch.py
      - name: Verify intended diff
        run: |
          git status --short
          git diff --check
      - name: Remove temporary patch scaffolding
        run: git rm .github/workflows/codex-issue-372-patch.yml scripts/issue372_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Wire unified color conversion shell [issue-372-patch]"
          git push origin HEAD:codex/issue-372-unified-color-conversion
