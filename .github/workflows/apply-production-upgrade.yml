name: Apply production softproof upgrade

permissions:
  contents: write

on:
  push:
    branches:
      - work/production-softproof-queue

jobs:
  upgrade-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Apply production upgrade
        shell: pwsh
        run: |
          python tools/decode_upgrade.py
          python tools/apply_production_upgrade.py
          python tools/post_upgrade_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Test Windows target
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Windows release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare application artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = "target/x86_64-pc-windows-msvc/release/ShadeEditor.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Copy-Item $exe artifact/ShadeEditor.exe
          "$hash  ShadeEditor.exe" | Set-Content -Encoding ascii -NoNewline artifact/ShadeEditor.exe.sha256
          Copy-Item README.md artifact/README.md
          Copy-Item RELEASE_NOTES.md artifact/RELEASE_NOTES.md
          Copy-Item LICENSE artifact/LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v0.17.0-win-x64
          path: artifact
          if-no-files-found: error

      - name: Remove temporary migration infrastructure
        shell: pwsh
        run: |
          git rm -r tools/upgrade_chunks
          git rm tools/decode_upgrade.py
          git rm tools/apply_production_upgrade.py
          git rm tools/post_upgrade_fix.py
          git rm .github/workflows/dev-inspect.yml
          git rm .github/workflows/apply-production-upgrade.yml

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Add production soft proof, diagnostics, export queue and templates"
          git push origin HEAD:work/production-softproof-queue
