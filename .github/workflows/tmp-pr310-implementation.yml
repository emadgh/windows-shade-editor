name: Temporary guarded PR310 full-resolution non-TIFF source implementation

on:
  pull_request:
    branches:
      - tmp/pr310-implementation-workflow

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fullres-png-jpeg-production-source
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply source adapter, validate, publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = '4afeeb0b32bee0b50b804150fe6fc618ed6dd02d'
          if ((git rev-parse HEAD).Trim() -ne $expectedHead) { throw 'PR310 feature head moved' }
          @'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: marker count {count}, expected 1: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          worker = Path('src/icc_conversion_worker.rs')

          replace_one(
              worker,
              '''use crate::icc_conversion::{IccSourceModel, ProductionCmykTransform, RuntimeIccProfile};\nuse crate::model::ShadeProject;\nuse crate::nchannel_icc::ProductionNChannelTransform;\nuse crate::tiff_io::{self, ColorModel, StreamInfo};\nuse crate::{dpi, export};\n''',
              '''use crate::icc_conversion::{IccSourceModel, ProductionCmykTransform, RuntimeIccProfile};\nuse crate::jpeg_source::{DecodedJpegSource, JpegSourceModel, decode_jpeg_source};\nuse crate::model::{MASTER_ADJUSTMENT_KEY, ShadeProject, apply_curve, apply_levels};\nuse crate::nchannel_icc::ProductionNChannelTransform;\nuse crate::png_source::{DecodedPngSource, PngSourceModel, decode_png_source};\nuse crate::source_transparency::{SourceTransparencyPolicy, composite_rgb_u16};\nuse crate::tiff_io::{self, ColorModel, StreamInfo};\nuse crate::{dpi, export};\n''',
          )

          replace_one(
              worker,
              '''        report(ConversionProgress::new(\n            ConversionPhase::Decode,\n            0.04,\n            "Inspecting streamable source topology",\n        ));\n        let stream = tiff_io::stream_info(&capture.source_face_path)?;\n        let source_model = source_model(&stream)?;\n        if !stream.streamable {\n            return Err(\n                "Production conversion requires a strip/tile-streamable TIFF source; full-image fallback is disabled to preserve bounded memory."\n                    .to_owned(),\n            );\n        }\n''',
              '''        report(ConversionProgress::new(\n            ConversionPhase::Decode,\n            0.04,\n            "Inspecting production source topology",\n        ));\n        let source = ProductionSourceRaster::load(&capture.source_face_path)?;\n        let source_model = source.source_model()?;\n        source.validate_transparency_policy(&capture.conversion_recipe)?;\n''',
          )
          replace_one(
              worker,
              '                let source_icc = load_verified_source_icc(capture, &stream)?;\n',
              '                let source_icc = load_verified_source_icc(capture, source.embedded_icc())?;\n',
          )
          replace_one(
              worker,
              '                } = load_verified_profiles(capture, &stream)?;\n',
              '                } = load_verified_profiles(capture, source.embedded_icc())?;\n',
          )
          replace_one(
              worker,
              '''            &stream,\n            output_icc.as_deref(),\n            &mut transform,\n            self.default_dpi,\n''',
              '''            &source,\n            output_icc.as_deref(),\n            &mut transform,\n            self.default_dpi,\n''',
          )

          source_adapter = r'''const DESIGN_SOURCE_ROWS_PER_STRIP: u32 = 64;

#[derive(Debug)]
enum ProductionSourceRaster {
    Tiff(StreamInfo),
    Png(DecodedPngSource),
    Jpeg(DecodedJpegSource),
}

impl ProductionSourceRaster {
    fn load(path: &Path) -> Result<Self, String> {
        let extension = path
            .extension()
            .and_then(|value| value.to_str())
            .map(str::to_ascii_lowercase)
            .unwrap_or_default();
        match extension.as_str() {
            "tif" | "tiff" => {
                let stream = tiff_io::stream_info(path)?;
                if !stream.streamable {
                    return Err(
                        "Production conversion requires a strip/tile-streamable TIFF source; full-image TIFF fallback is disabled to preserve bounded memory."
                            .to_owned(),
                    );
                }
                Ok(Self::Tiff(stream))
            }
            "png" => decode_png_source(path).map(Self::Png),
            "jpg" | "jpeg" => decode_jpeg_source(path).map(Self::Jpeg),
            _ => Err(format!(
                "Unsupported production source format for {}. Use RGB TIFF, PNG or JPEG, or CMYK TIFF.",
                path.display()
            )),
        }
    }

    fn source_model(&self) -> Result<IccSourceModel, String> {
        match self {
            Self::Tiff(stream) => tiff_source_model(stream),
            Self::Png(source) => match source.model {
                PngSourceModel::Rgb => Ok(IccSourceModel::Rgb),
                PngSourceModel::Gray => Err(
                    "Production color conversion currently requires RGB PNG artwork; Gray PNG is not enabled for the production transform path."
                        .to_owned(),
                ),
            },
            Self::Jpeg(source) => match source.model {
                JpegSourceModel::Rgb => Ok(IccSourceModel::Rgb),
                JpegSourceModel::Gray => Err(
                    "Production color conversion currently requires RGB JPEG artwork; Gray JPEG is not enabled for the production transform path."
                        .to_owned(),
                ),
            },
        }
    }

    fn embedded_icc(&self) -> Option<&[u8]> {
        match self {
            Self::Tiff(stream) => stream.metadata.icc_profile.as_deref(),
            Self::Png(source) => source.icc_profile.as_deref(),
            Self::Jpeg(source) => source.icc_profile.as_deref(),
        }
    }

    fn dimensions(&self) -> (u32, u32) {
        match self {
            Self::Tiff(stream) => (stream.metadata.width, stream.metadata.height),
            Self::Png(source) => (source.width, source.height),
            Self::Jpeg(source) => (source.width, source.height),
        }
    }

    fn source_channels(&self) -> usize {
        match self {
            Self::Tiff(stream) => stream.metadata.samples_per_pixel,
            Self::Png(source) => match source.model {
                PngSourceModel::Gray => 1,
                PngSourceModel::Rgb => 3,
            },
            Self::Jpeg(source) => match source.model {
                JpegSourceModel::Gray => 1,
                JpegSourceModel::Rgb => 3,
            },
        }
    }

    fn rows_per_strip(&self) -> u32 {
        match self {
            Self::Tiff(stream) => stream.rows_per_strip.max(1),
            Self::Png(source) => source.height.min(DESIGN_SOURCE_ROWS_PER_STRIP).max(1),
            Self::Jpeg(source) => source.height.min(DESIGN_SOURCE_ROWS_PER_STRIP).max(1),
        }
    }

    fn orientation(&self) -> Option<u16> {
        match self {
            Self::Tiff(stream) => stream.metadata.orientation,
            Self::Png(_) | Self::Jpeg(_) => None,
        }
    }

    fn dpi(&self, path: &Path, default_dpi: f64) -> dpi::DpiInfo {
        match self {
            Self::Tiff(_) => dpi::read_dpi(path, default_dpi),
            Self::Png(_) | Self::Jpeg(_) => dpi::DpiInfo::with_default(default_dpi),
        }
    }

    fn validate_transparency_policy(&self, recipe: &ConversionRecipe) -> Result<(), String> {
        let policy = recipe.source_transparency_policy;
        match self {
            Self::Png(source) if source.alpha.is_some() => {
                if policy.is_none() {
                    Err(
                        "Captured PNG contains alpha but the conversion recipe has no explicit flatten background policy."
                            .to_owned(),
                    )
                } else {
                    Ok(())
                }
            }
            Self::Png(_) => {
                if policy.is_some() {
                    Err(
                        "Captured conversion recipe contains an alpha-flatten policy, but this PNG has no alpha plane."
                            .to_owned(),
                    )
                } else {
                    Ok(())
                }
            }
            Self::Jpeg(_) => {
                if policy.is_some() {
                    Err(
                        "Captured conversion recipe contains an alpha-flatten policy, but JPEG has no alpha plane."
                            .to_owned(),
                    )
                } else {
                    Ok(())
                }
            }
            Self::Tiff(_) => {
                if policy.is_some() {
                    Err(
                        "Captured conversion recipe contains a PNG alpha-flatten policy for a TIFF source."
                            .to_owned(),
                    )
                } else {
                    Ok(())
                }
            }
        }
    }
}

'''
          replace_one(
              worker,
              'fn source_model(stream: &StreamInfo) -> Result<IccSourceModel, String> {\n',
              source_adapter + 'fn tiff_source_model(stream: &StreamInfo) -> Result<IccSourceModel, String> {\n',
          )

          replace_one(
