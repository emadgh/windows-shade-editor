name: Temporary guarded PR269 runtime preflight patch

on:
  pull_request:
    branches:
      - tmp/pr269-runtime-preflight-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Patch, format, validate, and publish
        shell: pwsh
        env:
          EXPECTED_HEAD: af669a9ccd71eb9bb60daa56de07fd9738f78201
          FEATURE_BRANCH: codex/design-source-runtime-preflight
        run: |
          git fetch origin $env:FEATURE_BRANCH
          $actual = (git rev-parse "origin/$env:FEATURE_BRANCH").Trim()
          if ($actual -ne $env:EXPECTED_HEAD) { throw "Feature branch moved: expected $env:EXPECTED_HEAD, got $actual" }
          git checkout --detach $env:EXPECTED_HEAD

          @'
          from pathlib import Path
          import re

          ui_path = Path("src/ui/color_conversion.rs")
          ui = ui_path.read_text(encoding="utf-8")

          old = """use windows_shade_editor::conversion_preflight::{\n    ConversionPreflightInput, ConversionPreflightReport, PreflightCode, PreflightSeverity,\n    SourceImageFormat, SourceProfileState, TransparencyState, build_conversion_preflight,\n};\n"""
          new = """use windows_shade_editor::conversion_preflight::{\n    ConversionPreflightInput, ConversionPreflightReport, PreflightCode, PreflightSeverity,\n    SourceImageFormat, SourceProfileState, TransparencyState, build_conversion_preflight,\n};\nuse windows_shade_editor::design_source::{\n    DesignSourceColorModel, DesignSourceDescriptor, SourceLossiness, SourceProfileOrigin,\n};\n"""
          if ui.count(old) != 1:
              raise SystemExit(f"ui import block: expected 1 occurrence, got {ui.count(old)}")
          ui = ui.replace(old, new)

          old = """    source_model: tiff_io::ColorModel,\n    color_model_label: &'static str,\n    bit_depth: u8,\n    channel_count: usize,\n"""
          new = """    source_model: tiff_io::ColorModel,\n    source_format: SourceImageFormat,\n    source_lossiness: SourceLossiness,\n    transparency: TransparencyState,\n    color_model_label: &'static str,\n    bit_depth: u8,\n    channel_count: usize,\n"""
          if ui.count(old) != 1:
              raise SystemExit(f"CurrentConversionSource fields: expected 1 occurrence, got {ui.count(old)}")
          ui = ui.replace(old, new)

          current_pattern = re.compile(
              r"    fn current_conversion_source\(&self\) -> Option<CurrentConversionSource> \{.*?\n    \}\n\n    fn assign_production_source_profile",
              re.S,
          )
          current_replacement = r'''    fn current_conversion_source(&self) -> Option<CurrentConversionSource> {
        let face = self.faces.get(self.current_face)?;
        let metadata = &face.preview.metadata;
        let descriptor = DesignSourceDescriptor::new(
            SourceImageFormat::Tiff,
            design_source_color_model(metadata.color_model),
            metadata.bit_depth,
            metadata.samples_per_pixel,
            metadata.icc_profile.as_deref(),
            TransparencyState::None,
            SourceLossiness::Lossless,
        );
        let source_model = tiff_color_model_from_design(descriptor.color_model);
        let save_gate = conversion_save_gate(ConversionSourceState {
            has_faces: !self.faces.is_empty(),
            has_saved_project_path: self.project_path.is_some(),
            has_unsaved_changes: self.project_dirty,
        });
        let face_ref = self.project.faces.get(self.current_face);
        let (profile, profile_label, production_profile_path, has_assigned_profile) =
            production_source_profile_state(&descriptor, face_ref);
        let profile_identity = profile.identity().cloned();
        let report = build_conversion_preflight(&ConversionPreflightInput::from_source(
            &descriptor,
            profile,
            save_gate,
        ));

        let face_label = self
            .project
            .faces
            .get(self.current_face)
            .map(|item| item.label.clone())
            .filter(|label| !label.trim().is_empty())
            .or_else(|| {
                face.path
                    .file_name()
                    .map(|name| name.to_string_lossy().into_owned())
            })
            .unwrap_or_else(|| format!("Face {}", self.current_face + 1));

        Some(CurrentConversionSource {
            face_label,
            source_path: face.path.clone(),
            source_model,
            source_format: descriptor.format,
            source_lossiness: descriptor.lossiness,
            transparency: descriptor.transparency,
            color_model_label: descriptor.color_model.title(),
            bit_depth: descriptor.bit_depth,
            channel_count: descriptor.channel_count,
            profile_identity,
            profile_label,
            production_profile_path,
            has_assigned_profile,
            snapshot_id: self.project.active_snapshot_id,
            save_gate,
            report,
        })
    }

    fn assign_production_source_profile'''
          ui, count = current_pattern.subn(current_replacement, ui)
          if count != 1:
              raise SystemExit(f"current_conversion_source: expected 1 replacement, got {count}")

          old = """                (\"Source\", source.source_path.display().to_string()),\n                (\"Color model\", source.color_model_label.to_owned()),\n                (\"Bit depth\", format!(\"{}-bit\", source.bit_depth)),\n                (\"Channels\", source.channel_count.to_string()),\n"""
          new = """                (\"Source\", source.source_path.display().to_string()),\n                (\"Format\", source.source_format.label().to_owned()),\n                (\"Color model\", source.color_model_label.to_owned()),\n                (\"Bit depth\", format!(\"{}-bit\", source.bit_depth)),\n                (\"Channels\", source.channel_count.to_string()),\n                (\"Source coding\", source.source_lossiness.label().to_owned()),\n                (\"Transparency\", source.transparency.label().to_owned()),\n"""
          if ui.count(old) != 1:
              raise SystemExit(f"source summary rows: expected 1 occurrence, got {ui.count(old)}")
          ui = ui.replace(old, new)

          old = """fn conversion_color_model(model: tiff_io::ColorModel) -> ConversionColorModel {\n"""
          new = """fn design_source_color_model(model: tiff_io::ColorModel) -> DesignSourceColorModel {\n    match model {\n        tiff_io::ColorModel::Gray => DesignSourceColorModel::Gray,\n        tiff_io::ColorModel::Rgb => DesignSourceColorModel::Rgb,\n        tiff_io::ColorModel::Cmyk => DesignSourceColorModel::Cmyk,\n        tiff_io::ColorModel::Other => DesignSourceColorModel::Other,\n    }\n}\n\nfn tiff_color_model_from_design(model: DesignSourceColorModel) -> tiff_io::ColorModel {\n    match model {\n        DesignSourceColorModel::Gray => tiff_io::ColorModel::Gray,\n        DesignSourceColorModel::Rgb => tiff_io::ColorModel::Rgb,\n        DesignSourceColorModel::Cmyk => tiff_io::ColorModel::Cmyk,\n        DesignSourceColorModel::Other => tiff_io::ColorModel::Other,\n    }\n}\n\nfn conversion_color_model(model: tiff_io::ColorModel) -> ConversionColorModel {\n"""
          if ui.count(old) != 1:
              raise SystemExit(f"conversion_color_model anchor: expected 1 occurrence, got {ui.count(old)}")
          ui = ui.replace(old, new)

          profile_pattern = re.compile(
              r"fn production_source_profile_state\(\n    metadata: &tiff_io::TiffMetadata,\n    face: Option<&model::FaceRef>,\n\) -> \(SourceProfileState, String, Option<String>, bool\) \{.*?\n\}\n\nfn conversion_profile_identity",
              re.S,
          )
          profile_replacement = r'''fn production_source_profile_state(
    source: &DesignSourceDescriptor<'_>,
    face: Option<&model::FaceRef>,
) -> (SourceProfileState, String, Option<String>, bool) {
    let assignment = face.and_then(|face| face.production_source_profile.as_ref());
    let source_model = tiff_color_model_from_design(source.color_model);
    match source.preferred_profile_origin(assignment.is_some()) {
        SourceProfileOrigin::Assigned => {
            let assignment = assignment.expect("assigned profile origin requires assignment");
            let path = PathBuf::from(&assignment.path);
            match color_management::inspect_production_source_profile(
                &path,
                &assignment.identity,
                source_model,
            ) {
                Ok(profile) => (
                    SourceProfileState::Assigned(conversion_profile_identity(profile.identity())),
                    format!("Assigned: {}", profile.description),
                    Some(assignment.path.clone()),
                    true,
                ),
                Err(err) => (
                    SourceProfileState::Invalid(err),
                    format!(
                        "Assigned profile invalid: {}",
                        assignment.identity.description
                    ),
                    Some(assignment.path.clone()),
                    true,
                ),
            }
        }
        SourceProfileOrigin::Embedded | SourceProfileOrigin::Missing => {
            match color_management::production_embedded_profile_identity_bytes(
                source.embedded_icc,
                source_model,
            ) {
                Ok(Some(identity)) => (
                    SourceProfileState::Embedded(conversion_profile_identity(&identity)),
                    format!("Embedded: {}", identity.description),
                    None,
                    false,
                ),
                Ok(None) => (
                    SourceProfileState::Missing,
                    "Missing production Source ICC".to_owned(),
                    None,
                    false,
                ),
                Err(err) => (
                    SourceProfileState::Invalid(err),
                    "Embedded production Source ICC is invalid".to_owned(),
                    None,
                    false,
                ),
            }
        }
    }
}

fn conversion_profile_identity'''
          ui, count = profile_pattern.subn(profile_replacement, ui)
          if count != 1:
              raise SystemExit(f"production_source_profile_state: expected 1 replacement, got {count}")

          ui_path.write_text(ui, encoding="utf-8")

          cm_path = Path("src/color_management.rs")
          cm = cm_path.read_text(encoding="utf-8")
          cm_pattern = re.compile(
              r"pub fn production_embedded_profile_identity\(\n    metadata: &TiffMetadata,\n\) -> Result<Option<IccProfileIdentity>, String> \{.*?\n\}\n\n/// Reopen and verify",
              re.S,
          )
          cm_replacement = r'''pub fn production_embedded_profile_identity(
    metadata: &TiffMetadata,
) -> Result<Option<IccProfileIdentity>, String> {
    production_embedded_profile_identity_bytes(
        metadata.icc_profile.as_deref(),
        metadata.color_model,
    )
}

/// Inspect embedded ICC bytes from any supported design-source container using
/// the same fail-closed production interpretation rules as TIFF.
pub fn production_embedded_profile_identity_bytes(
    bytes: Option<&[u8]>,
    source_model: ColorModel,
) -> Result<Option<IccProfileIdentity>, String> {
    let Some(bytes) = bytes else {
        return Ok(None);
    };
    if bytes.is_empty() {
        return Err("Embedded production Source ICC payload is empty.".to_owned());
    }
    let profile = Profile::new_icc(bytes)
        .map_err(|err| format!("Cannot open embedded production Source ICC: {err}"))?;
    let Some(expected) = expected_color_space(source_model) else {
        return Err(format!(
            "{} source data is not supported by production Source ICC assignment.",
            source_model.title()
        ));
    };
    if profile.color_space() != expected {
        return Err(format!(
            "Embedded Source ICC color space {} does not match source {}.",
            color_space_label(profile.color_space()),
            source_model.title()
        ));
    }
    Ok(Some(IccProfileIdentity {
        description: profile_description(&profile),
        sha256: format!("{:x}", Sha256::digest(bytes)),
    }))
}

/// Reopen and verify'''
          cm, count = cm_pattern.subn(cm_replacement, cm)
          if count != 1:
              raise SystemExit(f"production_embedded_profile_identity: expected 1 replacement, got {count}")
          cm_path.write_text(cm, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 .github\tmp-pr269-patch.py
          python .github\tmp-pr269-patch.py
          Remove-Item .github\tmp-pr269-patch.py

          cargo fmt --all
          $changed = @(git diff --name-only)
          $allowed = @(
            'src/color_management.rs',
            'src/conversion_preflight.rs',
            'src/design_source.rs',
            'src/lib.rs',
            'src/ui/color_conversion.rs'
          )
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) { throw "Unexpected patch surface: $path" }
          }
          if ($changed -notcontains 'src/ui/color_conversion.rs') { throw 'UI preflight patch missing' }
          if ($changed -notcontains 'src/color_management.rs') { throw 'Color-management source ICC patch missing' }

          cargo check --locked --target x86_64-pc-windows-msvc
          cargo test --locked --target x86_64-pc-windows-msvc

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/color_management.rs src/conversion_preflight.rs src/design_source.rs src/lib.rs src/ui/color_conversion.rs
          git commit -m "Color Conversion: wire runtime design-source preflight"
          git push origin HEAD:refs/heads/$env:FEATURE_BRANCH
