name: Validate UI decomposition v0.19.2

on:
  push:
    branches:
      - refactor/v020-ui-decomposition-2

permissions:
  contents: write

jobs:
  decompose-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Narrow Curve extraction boundary
        shell: pwsh
        run: |
          $path = '.github/scripts/apply_v020_ui_decomposition_2.py'
          $text = Get-Content $path -Raw
          $old = 'curve_end_marker = "fn build_project_file_metadata("'
          $new = 'curve_end_marker = "fn mixer_ui("'
          if (-not $text.Contains($old)) { throw 'Expected broad Curve boundary not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline
      - name: Apply second UI decomposition
        run: python .github/scripts/apply_v020_ui_decomposition_2.py
      - name: Fix generated Recent assertion quoting
        shell: pwsh
        run: |
          $path = 'src/ui/mod.rs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('main.contains(""Recent projects"")', 'main.contains(r#""Recent projects""#)')
          Set-Content -Path $path -Value $text -NoNewline
      - name: Move Curve regression tests with implementation
        shell: pwsh
        run: |
          $mainPath = 'src/main.rs'
          $curvePath = 'src/ui/curve_editor.rs'
          $lines = [System.Collections.Generic.List[string]](Get-Content $mainPath)
          $moduleIndex = -1
          for ($i = 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq 'mod tonal_curve_interaction_tests {' -and $lines[$i - 1].Trim() -eq '#[cfg(test)]') {
              $moduleIndex = $i
              break
            }
          }
          if ($moduleIndex -lt 1) { throw 'tonal_curve_interaction_tests module not found' }
          $start = $moduleIndex - 1
          $end = -1
          for ($i = $moduleIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('fn snapshot_day_time(')) {
              $end = $i
              break
            }
          }
          if ($end -le $start) { throw 'snapshot_day_time boundary after Curve tests not found' }
          $block = $lines.GetRange($start, $end - $start)
          $lines.RemoveRange($start, $end - $start)
          Set-Content -Path $mainPath -Value $lines
          Add-Content -Path $curvePath -Value ''
          Add-Content -Path $curvePath -Value $block
      - name: Expose shared Curve entry points
        shell: pwsh
        run: |
          $curvePath = 'src/ui/curve_editor.rs'
          $curve = Get-Content $curvePath -Raw
          $old = 'fn tonal_display_value(value: f32, mode: TonalDisplayMode) -> f32 {'
          $new = 'pub(crate) fn tonal_display_value(value: f32, mode: TonalDisplayMode) -> f32 {'
          if (-not $curve.Contains($old)) { throw 'tonal_display_value signature not found' }
          $curve = $curve.Replace($old, $new)
          Set-Content -Path $curvePath -Value $curve -NoNewline

          $mainPath = 'src/main.rs'
          $main = Get-Content $mainPath -Raw
          $anchor = "use ui::input_router;"
          if (-not $main.Contains($anchor)) { throw 'input router import anchor not found' }
          $main = $main.Replace($anchor, "use ui::curve_editor::{curves_ui, tonal_display_value};`r`nuse ui::input_router;")
          Set-Content -Path $mainPath -Value $main -NoNewline
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check Release graph
        run: cargo check --release --locked
      - name: Full Release tests
        run: cargo test --release --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Validate version and architecture
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          $version = (Get-Content VERSION -Raw).Trim()
          if ($cargo -ne '0.19.2' -or $version -ne '0.19.2') { throw "Version mismatch: Cargo=$cargo VERSION=$version" }
          foreach ($file in @('src/ui/faces.rs','src/ui/curve_editor.rs','src/ui/project_navigation.rs','src/ui/input_router.rs','docs/UI_DECOMPOSITION.md')) {
            if (-not (Test-Path $file)) { throw "Missing extracted architecture file: $file" }
          }
          if (Test-Path src/input_router.rs) { throw 'Legacy root input_router.rs still exists' }
          if (Select-String -Path src/main.rs -Pattern 'mod tonal_curve_interaction_tests' -Quiet) { throw 'Curve tests still live in main.rs' }
          if (-not (Select-String -Path src/ui/curve_editor.rs -Pattern 'mod tonal_curve_interaction_tests' -Quiet)) { throw 'Curve tests were not moved with implementation' }
          Write-Host "main.rs lines: $((Get-Content src/main.rs).Count)"
          Write-Host "workflow.rs lines: $((Get-Content src/workflow.rs).Count)"
      - name: Commit validated second pass
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): extract faces curve and project navigation (#40)"
          git push
      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: ShadeEditor-v0.19.2-windows-x64
          path: target/release/ShadeEditor.exe
          if-no-files-found: error
