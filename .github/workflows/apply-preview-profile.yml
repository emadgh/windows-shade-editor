name: Apply preview profile assignment

permissions:
  contents: write

on:
  push:
    branches:
      - work/preview-profile-assignment

jobs:
  migrate-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply source cleanup and preview profile assignment
        run: python tools/apply_preview_profile.py
      - name: Apply compile cleanup
        run: python tools/fix_preview_profile_compile.py
      - name: Format
        run: cargo fmt --all
      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Test Windows target
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Remove temporary migration files
        shell: pwsh
        run: |
          git rm .github/workflows/apply-preview-profile.yml
          git rm tools/apply_preview_profile.py
          git rm tools/fix_preview_profile_compile.py
      - name: Commit validated changes
        shell: pwsh
        run: |
          git config user.name "Shade Editor CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[skip ci] Add project preview profile assignment and clean legacy sources"
          git push origin HEAD:work/preview-profile-assignment
