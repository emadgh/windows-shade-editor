name: Apply v0.15.1 safe save

on:
  push:
    paths:
      - scripts/apply_v0151_safe_save.py
      - .github/workflows/apply-v0151-safe-save.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Apply source migration
        run: python -X utf8 scripts/apply_v0151_safe_save.py
      - name: Format
        run: cargo fmt --all
      - name: Verify diff
        run: git diff --check
      - name: Check locked Windows build
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test locked Windows build
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Commit source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/app_main.rs src/model_v6.rs src/recovery.rs src/safe_fs.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Harden project saves and recovery integrity"
          git push origin HEAD:main
