name: Temporary PR293 simple compiler diagnostic

on:
  pull_request:
    branches:
      - tmp/pr293-diagnostic2-workflow

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/design-source-runtime-wiring
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Reconstruct retry6 and tee cargo check output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git show origin/tmp/pr284-runtimeface-retry6:.github/workflows/tmp-pr284-runtimeface-retry6.yml | Out-File -Encoding utf8 retry6.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          text = Path('retry6.yml').read_text(encoding='utf-8-sig')
          marker = '        run: |\n'
          start = text.index(marker) + len(marker)
          lines = text[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          old = '''cargo check --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/workflow.rs src/ui/adjustments.rs src/ui/test_code_panel.rs src/thumbnail.rs src/color_management.rs src/ui/color_conversion.rs
          git commit -m 'feat: wire RuntimePreview application and source-aware preflight (#281)'
          git push origin HEAD:codex/design-source-runtime-wiring
          '''
          new = '''New-Item -ItemType Directory -Force diagnostics | Out-Null
          cargo check --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath diagnostics/pr293-check.txt
          $checkExit = $LASTEXITCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f diagnostics/pr293-check.txt
          git commit -m 'diagnostic: capture retry6 cargo check output'
          git push origin HEAD:tmp/pr293-diagnostic2-output --force
          exit $checkExit
          '''
          if script.count(old) != 1:
              raise SystemExit(f'Expected one validation/publish tail, got {script.count(old)}')
          Path('retry6-diagnostic2.ps1').write_text(script.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File retry6-diagnostic2.ps1
