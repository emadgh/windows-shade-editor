name: Apply Shade Editor v0.9 UI changes

on:
  push:
    branches: [feat/v090-production-workflow]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v090-production-workflow
          fetch-depth: 0
      - name: Apply v0.9 UI patch once
        shell: bash
        run: |
          if grep -q 'version = "0.8.1"' Cargo.toml; then
            python scripts/apply_v090_ui.py
            cargo fmt --all
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml RELEASE_NOTES.md src/app_main.rs src/model_v6.rs src/history.rs src/recovery.rs
            git commit -m "Add v0.9 history recovery and before-after workflow"
            git push origin HEAD:feat/v090-production-workflow
          else
            echo "v0.9 UI patch already applied"
          fi
