name: Validate Issue 68 Mixer and Preview Indicator

on:
  push:
    branches:
      - feat/68-responsive-mixer-preview-indicator

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/68-responsive-mixer-preview-indicator
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply deterministic Issue 68 patch
        run: python scripts/issue68_patch.py

      - name: Resolve lockfile
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Format
        run: cargo fmt --all

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Locked Windows check
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Full Release tests
        run: cargo test --locked --release --target x86_64-pc-windows-msvc

      - name: Release build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Build and test native Shell extension
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist shell\bin mkdir shell\bin
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeProjectDataTests.exe shell\ShadeProjectDataTests.cpp shell\ShadeProjectData.cpp
          if errorlevel 1 exit /b 1
          shell\bin\ShadeProjectDataTests.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /LD /Fe:shell\bin\ShadeEditorShell.dll shell\ShadeEditorShell.cpp shell\ShadeProjectData.cpp /link ole32.lib shlwapi.lib windowscodecs.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Fe:shell\bin\ShadeShellTests.exe shell\ShadeShellTests.cpp /link ole32.lib shlwapi.lib propsys.lib gdi32.lib
          if errorlevel 1 exit /b 1
          shell\bin\ShadeShellTests.exe shell\bin\ShadeEditorShell.dll
          if errorlevel 1 exit /b 1

      - name: Validate Shell schema and Issue 68 invariants
        shell: pwsh
        run: |
          [xml](Get-Content -Raw shell/ShadeEditor.propdesc) | Out-Null
          @'
          from pathlib import Path
          assert Path("VERSION").read_text().strip() == "0.20.7"
          assert 'version = "0.20.7"' in Path("Cargo.toml").read_text()
          mixer = Path("src/ui/levels_mixer.rs").read_text()
          status = Path("src/ui/preview_status.rs").read_text()
          main = Path("src/main.rs").read_text()
          assert "struct MixerRowLayout" in mixer
          assert "ui.allocate_ui_with_layout" in mixer
          assert "slider_width" in mixer
          assert "current_generation_is_rendering" in status
          assert "paint_updating_indicator" in status
          assert "render_busy == Some((current_face, generation))" in status
          assert "preview_is_updating" in main
          assert "paint_updating_indicator(ui, preview_viewport_rect)" in main
          '@ | Set-Content -Encoding utf8 validate68.py
          python validate68.py
          Remove-Item validate68.py

      - name: Commit validated production files only
        shell: pwsh
        run: |
          if (Test-Path shell/bin) { Remove-Item shell/bin -Recurse -Force }
          Remove-Item *.obj -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION Cargo.toml Cargo.lock RELEASE_NOTES.md src/ui/levels_mixer.rs src/ui/preview_status.rs src/ui/mod.rs src/main.rs
          $changes = git diff --cached --name-only
          if (-not $changes) {
            Write-Host "Production tree already matches the validated Issue #68 patch."
            exit 0
          }
          git commit -m "feat(v0.20.7): responsive Mixer and preview update indicator (#68)"
          git push origin HEAD:feat/68-responsive-mixer-preview-indicator
