name: Apply Shade Editor v0.8.1 source migration

on:
  push:
    branches: [feat/physical-dimensions-dirty-guards]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/physical-dimensions-dirty-guards
          fetch-depth: 0
      - name: Apply v0.8.1 patch once
        shell: bash
        run: |
          if grep -q 'version = "0.8.0"' Cargo.toml; then
            python scripts/apply_v081.py
            cargo fmt --all
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml RELEASE_NOTES.md src/app_main.rs
            git commit -m "Add physical dimensions and dirty-state guards"
            git push origin HEAD:feat/physical-dimensions-dirty-guards
          else
            echo "v0.8.1 patch already applied"
          fi
