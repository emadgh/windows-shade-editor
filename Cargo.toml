[package]
name = "windows-shade-editor"
version = "0.21.102"
edition = "2024"
description = "Native multi-channel TIFF shade editor for digital ceramic printing"
license = "MIT"
autobins = false

[[bin]]
name = "ShadeEditor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
fontdue = "0.9.3"
lcms2 = { version = "6.1.1", features = ["static"] }
memmap2 = "0.9"
base64 = "0.22.1"
png = "0.18.0"
jpeg-decoder = { version = "0.3.2", default-features = false }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiff = { version = "0.11.3", features = ["lzw", "deflate"] }
sha2 = "0.10.9"
update-via-github = { git = "https://github.com/emadgh/update-via-github.git" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_ColorSystem",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# Measurement-only counterpart for Issue #374. Keep normal release semantics
# unchanged until representative ceramic-workload benchmarks prove which profile
# should become the production default.
[profile.release-throughput]
inherits = "release"
opt-level = 3
