[package]
name = "windows-shade-editor"
version = "0.4.0"
edition = "2024"
description = "Native multi-channel TIFF shade editor for digital ceramic printing"
license = "MIT"
autobins = false

[[bin]]
name = "ShadeEditor"
path = "src/app_main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts"] }
fontdue = "0.9.3"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiff = { version = "0.11.3", features = ["lzw", "deflate"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Networking_WinHttp",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
